# .github/workflows/frontend-ci.yml — BTS 프론트엔드 CI (lint / typecheck / test 병렬 잡)
# Scope. apps/web (frontend). ADR. docs/decisions/2026-05-22-frontend-logging-policy.md (D5-c)
# 잡 분리 이유. 단일 잡(install→lint→typecheck→test)이 10분 예산을 공유해 vitest 전체 스위트가
# 타임아웃으로 cancelled 되던 문제(FR-PR-01~03 공통)를 해소. 세 잡을 병렬화해 test가 독립 예산을 갖는다.
name: frontend-ci

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-ci.yml'
      # 계약 정본. 백엔드 DTO 를 고치고 스냅샷만 재생성하는 PR 은 backend/** + docs/** 만 건드려
      # 이 워크플로우가 아예 안 돌았다 — 계약을 바꾸는 바로 그 PR 에서 프론트 검증이 빠진다.
      - 'docs/contracts/**'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-ci.yml'
      # 계약 정본. 백엔드 DTO 를 고치고 스냅샷만 재생성하는 PR 은 backend/** + docs/** 만 건드려
      # 이 워크플로우가 아예 안 돌았다 — 계약을 바꾸는 바로 그 PR 에서 프론트 검증이 빠진다.
      - 'docs/contracts/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node 22 (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Lint (no-console + react-hooks + tseslint)
        run: pnpm --filter @bts/web lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node 22 (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck (TS strict)
        run: pnpm --filter @bts/web typecheck

  test:
    runs-on: ubuntu-latest
    # 관측치. 전체 스위트가 CI에서 ~12m47s (2026-07-07 #242). 성장 여유를 위해 20분.
    # 스위트가 계속 커지면 vitest --shard 매트릭스로 벽시계 단축(후속).
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node 22 (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Test (vitest unit + msw)
        run: pnpm --filter @bts/web test
