# 인프라 설정 검증 CI — nginx 접속로그 경로토큰 마스킹 봉인
#
# 왜 필요한가. 이 레포에서 nginx.conf 는 Gradle 도 vitest 도 읽지 않는다. 이 워크플로우가
# 없으면 봉인 스크립트는 로컬 1회성 확인으로 끝나고 썩는다 — 선행 #310 ADR 이 "범위 밖" 으로
# 적어둔 항목이 3주 잠복해 이 PR 이 된 것과 같은 실패 양식이다.
#
# ## 러너 — self-hosted (`bts-local`)
# 2026-07-29 17:32 KST 부터 GitHub Actions 결제 차단으로 `ubuntu-latest` 잡이 배정조차 되지 않는다
# (`steps=0` · 어노테이션 "recent account payments have failed or your spending limit needs to be
# increased"). self-hosted 러너는 이 차단을 받지 않는다 — 확인 사격 run 30508738275 에서 실증.
# 러너 신원과 복구 절차. docs/runbooks/self-hosted-runner.md
# 이 파일의 `runs-on` 을 되돌리면 scripts/workflow/ci-runner-label-alignment.test.ts 가 차단한다.
name: infra-ci

# ★2026-08-21 — 자동 실행을 껐다. `workflow_dispatch` 로만 돈다.
#
# 왜. 1인 개발 · 실사용자 0명 단계에서 이 CI 는 값을 하지 않는다. 실증 —
# 제품을 못 쓰게 만든 결함(`users` 0행 → 로그인 계정 0개)을 CI 4종·판별식 25종·
# 게이트 2개 중 아무것도 잡지 못했다. 반면 벽시계의 59%(run 당 23.7분)를 큐 대기로 태웠고
# 러너 2대가 같은 라벨이라 판정이 배정에 따라 갈렸다(판별식 잡 최근 12회 중 7회 실패).
#
# ★`ubuntu-latest` 로 옮기는 선택지는 없다 — 결제 차단으로 배정조차 안 된다(`steps=0`).
#   docs/runbooks/self-hosted-runner.md §1 이 이를 영구 설계로 확정했다.
#
# 대신 어디서 보는가. 커밋 전 = `.husky/pre-commit`(바뀐 모듈만) · 배포 전 = `bts-deploy.sh`.
# 되살리려면 이 블록을 지우고 원본 트리거를 복원한다 — `git show <이 커밋>^:<이 파일>`.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  nginx-log-masking:
    name: nginx 접속로그 마스킹 봉인
    runs-on: [self-hosted, bts-local]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # docker 는 self-hosted 러너(maxi-mac-bts)에 설치돼 있다. 스크립트가 nginx:1.27-alpine 으로
      # 문법 검증(nginx -t)과 실효 검증(실제 요청 → 로그에 원문 토큰 0회)을 수행한다.
      - name: 봉인 3축 + 문법 + 실효 검증
        run: bash scripts/verify/nginx-log-masking.sh

  springdoc-not-exposed:
    name: springdoc 외부 미노출 봉인
    runs-on: [self-hosted, bts-local]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # 도커 불요 — nginx.conf 라우팅 정규식과 compose 포트 발행만 정적으로 판정한다.
      # 백엔드가 springdoc 경로를 WebSecurityCustomizer.ignoring 으로 필터체인 밖에 두므로,
      # 지금 안전한 유일한 이유는 "nginx 가 그 경로를 프록시하지 않고 백엔드 포트가 안 열려 있다" 는
      # 배포 토폴로지다. 그 두 성질이 깨지는 순간을 이 잡이 잡는다.
      - name: 봉인 3축 (대조군 · 라우팅 · 포트)
        run: bash scripts/verify/springdoc-not-exposed.sh
