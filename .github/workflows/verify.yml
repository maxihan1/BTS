# 검증 정본 — 무엇을 돌릴지는 계산기가 정하고 이 파일은 그 판정을 실행만 한다
#
# ## ★`paths:` 를 쓰지 않는다 — 실측 근거
#
# 「티어별 최소 CI」의 순진한 구현은 `on.push.paths:` 필터다. 이 저장소에서는 틀린 답이다.
# `surfaces.ts` 의 60 글로브로 생성하면 다음이 **매칭 0건**이다.
#
#     apps/web/playwright.config.ts   apps/web/vite.config.ts   apps/web/vitest.config.ts
#     apps/web/tsconfig.app.json      backend/modules/<bc>/build.gradle.kts
#     infra/docker-compose.dev.yml
#
# `playwright.config.ts` 의 `testIgnore` 한 줄이 E2E 819건을 끈다. 그 파일을 고치면
# 워크플로우가 **아예 안 뜬다** — 빨간불이 아니라 부재다. 그리고 `paths:` 로 걸러진
# 워크플로우를 브랜치 보호의 필수 체크로 걸면 PR 이 영구 pending 이 된다.
#
# 범주 오류였다. `surfaces.ts` 는 「어떤 절차를 밟을까」의 분류기이지
# 「무엇이 바뀌면 무엇을 돌릴까」의 목록이 아니다. 후자의 정본은 이미 따로 있다.
#
# ## 그래서 — 워크플로우는 항상 뜨고, 잡이 조건을 진다
#
# `route` 잡이 `select-test-scope.ts --json` 을 **1회** 실행해 판정을 내고,
# 나머지 잡이 `needs.route.outputs.*` 를 `if:` 로 읽는다. 티어별 최소는 잡 수준에서 실현된다.
#
# ★YAML 에 판정을 다시 적지 않는다. `Jenkinsfile:255` 가 이 순간을 예고했다 —
#   「Groovy 로 다시 적으면 두 목록이 되고 **새 CI 파일이 생길 때 한쪽만 고쳐진다**」.
#   계약. scripts/workflow/ci-route-json-parity.test.ts
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 판정 1회. 여기서 나온 값이 아래 모든 잡의 조건이 된다.
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      modules: ${{ steps.scope.outputs.modules }}
      frontend: ${{ steps.scope.outputs.frontend }}
      e2e: ${{ steps.scope.outputs.e2e }}
      deep: ${{ steps.scope.outputs.deep }}
      full: ${{ steps.full.outputs.full }}
    steps:
      # ★fetch-depth: 0 이 필수다. 얕은 클론이면 `merge-base` 가 실패하고
      #   계산기가 「비교 기준을 못 정했다 — 전 모듈로 넓힌다」로 폴백한다.
      #   그러면 매번 전량이 돌아 이 파일의 목적이 통째로 사라진다.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      # ★★전량 판정을 먼저 한다 — 젠킨스 `전량 판정` stage 가 하던 일이다.
      #   CI 설정(워크플로우 · 선별기 자신 · backend/)이 바뀌면 영향 범위를 알 수 없어
      #   전량으로 다뤄야 한다. 이 단계를 빠뜨리면 **CI 를 통째로 바꾼 PR 이
      #   백엔드·프론트 0건으로 초록**이 된다 — 실제로 이 워크플로우의 첫 실행이 그랬다
      #   (run 34603847967 · backend·frontend 둘 다 skipped).
      #   판정 입력은 `WIDEN_PREFIXES` 하나다. 여기에 목록을 다시 적지 않는다.
      - id: full
        name: 전량 판정
        env:
          BTS_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          full="$(node --experimental-strip-types scripts/workflow/requires-full-build.ts)"
          echo "전량 빌드 요구: $full"
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - id: scope
        name: 범위 판정 — 계산기 1회
        env:
          # `diff-base.ts` 는 `BTS_DIFF_BASE` 를 1순위로 읽는다(젠킨스의
          # GIT_PREVIOUS_SUCCESSFUL_COMMIT 자리). 없으면 origin/main 분기점으로 폴백한다.
          BTS_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          # 계산기가 이 값을 읽어 백엔드·프론트를 전량으로 넓힌다. 젠킨스 `전량` stage 와 같은 자리.
          BTS_FORCE_FULL: ${{ steps.full.outputs.full == 'true' && '1' || '' }}
        run: |
          set -eu
          scope="$(node --experimental-strip-types scripts/workflow/select-test-scope.ts --json)"
          echo "판정: $scope"
          echo "modules=$(echo "$scope" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.stringify(JSON.parse(s).modules)))')" >> "$GITHUB_OUTPUT"
          echo "frontend=$(echo "$scope" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).frontend))')" >> "$GITHUB_OUTPUT"
          echo "e2e=$(echo "$scope" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).e2e))')" >> "$GITHUB_OUTPUT"
          # 조립 부팅은 main 푸시이거나 전량일 때 본다 — 젠킨스 `RUN_DEEP = RUN_FULL || main` 과 같다.
          if [ "${{ steps.full.outputs.full }}" = "true" ] || \
             { [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; }; then
            echo "deep=true" >> "$GITHUB_OUTPUT"
          else
            echo "deep=false" >> "$GITHUB_OUTPUT"
          fi

  # ★조건을 걸지 않는다. `discriminant-hook-wiring` 의 무조건성 봉인과 같은 취지다 —
  #   판별식은 CI 설정 자체를 검사하므로 「경로가 안 바뀌었으니 생략」이 곧 사각이 된다.
  #   비용도 그럴 만하다. GHA 실측 43초.
  discriminants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - name: 판별식 전량
        run: node --experimental-strip-types --test 'scripts/**/*.test.ts' 'scripts/**/*.test.mjs'

  frontend:
    needs: route
    if: needs.route.outputs.frontend != 'skip'
    runs-on: ubuntu-latest
    # ★실측 22분 33초 (run 34604473695 · 전량 vitest). **이 잡이 전체 벽시계를 정한다** —
    #   백엔드 9모듈은 병렬이라 최장 17분 27초이고 프론트가 그보다 길다.
    #   조사 실측으로 이 시간의 73% 가 vitest 준비 비용이다. 다음 다이어트 표적이 여기다.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bts/web typecheck
      - run: pnpm --filter @bts/web lint
      # 계산기가 `all` 인지 `related` 인지 이미 정했다. 여기서 다시 판정하지 않는다.
      # ★`--section` 으로 블록을 통째로 받는다. YAML 이 명령을 리터럴로 적으면
      #   계산기와 두 목록이 된다 — `ci-route-json-parity.test.ts` ⑦이 그것을 막는다.
      - name: vitest — 계산기가 낸 블록을 그대로 돈다
        env:
          BTS_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          # ★route 와 같은 입력을 줘야 판정이 일치한다. 빠뜨리면 route 는 `all` 로 보고
          #   이 잡은 `related` 로 도는 어긋남이 생긴다 — 잡이 떴는데 범위가 다른 자리다.
          BTS_FORCE_FULL: ${{ needs.route.outputs.full == 'true' && '1' || '' }}
        run: |
          set -eu
          node --experimental-strip-types scripts/workflow/select-test-scope.ts --section frontend > .ci-frontend.sh
          cat .ci-frontend.sh
          sh -e .ci-frontend.sh

  backend:
    needs: route
    if: needs.route.outputs.modules != '[]'
    runs-on: ubuntu-latest
    # ★실측으로 정했다 (run 34604473695 · 전량 모드 9모듈).
    #   최장 issue-tracking 17분 27초 · identity-access 13분 3초 · 최단 shared-kernel 3분 5초.
    #   맥 8코어 웜 실측(9분 13초)의 약 1.9배다. 여유를 2배 가까이 둔다 —
    #   콜드 캐시·러너 편차·generateJooq 재생성이 겹치면 늘어난다.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.route.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: ${{ matrix.module }} 테스트
        working-directory: backend
        run: ./gradlew :modules:${{ matrix.module }}:test --console=plain
      - name: ${{ matrix.module }} 린트
        working-directory: backend
        run: ./gradlew :modules:${{ matrix.module }}:ktlintCheck :modules:${{ matrix.module }}:detekt --rerun-tasks --console=plain

  # ★E2E 전량. Maxi 확정(2026-09-11) — 종전에는 「바뀐 스펙만」이라 169파일 819건이
  #   파이프라인 어디에서도 안 돌았다. 전량이므로 **판정할 것이 없다** — 계산기를 거치지 않고
  #   YAML 이 직접 적어도 두 목록이 생기지 않는다(`ci-route-json-parity` ⑦의 경계).
  #   대신 지켜야 할 것은 「샤드가 전체를 빠짐없이 덮는가」이고 그것은 판별식의 몫이다.
  #   계약. scripts/workflow/e2e-shard-coverage.test.ts
  e2e:
    needs: route
    if: needs.route.outputs.frontend != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: playwright 브라우저
        run: pnpm --filter @bts/web exec playwright install --with-deps chromium
      - name: E2E 샤드 ${{ matrix.shard }}/8
        working-directory: apps/web
        run: pnpm exec playwright test --project=chromium --shard=${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/

  # 시각 회귀. ★소유자는 **이 잡 하나**다 — 두 곳에서 돌면 같은 기준 PNG 4장을 놓고
  #   두 번 비교하게 되고, 한쪽 러너가 다르면 그 차이가 회귀로 보인다.
  #   기준은 #492 에서 리눅스 러너로 생성됐다. GHA 러너와 픽셀 일치를 실측으로 확인했다
  #   (runner-smoke run 34602622965 visual · 2분 3초 · success).
  visual:
    needs: route
    if: needs.route.outputs.frontend != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: playwright 브라우저
        run: pnpm --filter @bts/web exec playwright install --with-deps chromium
      - name: 시각 회귀
        working-directory: apps/web
        run: pnpm exec playwright test --project=visual
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: visual-diff
          path: apps/web/test-results/

  # 조립 부팅. main 푸시에서만 — 젠킨스 RUN_DEEP 과 같은 자리다.
  # ★순정 postgres 로 통과하는 것을 실측으로 확인했다 (runner-smoke assemble · 7분 57초).
  #   ProdAssemblyHttpTestBase.kt:33 이 「손수 시드된 dev DB」를 전제로 적고 있어
  #   설계 단계에서는 실패가 예상됐으나, pgmq 이미지 + BTS_DB_URL 만으로 충분했다.
  assemble:
    needs: route
    if: needs.route.outputs.deep == 'true'
    runs-on: ubuntu-latest
    # ★실측 7분 19초 (run 34604473695).
    timeout-minutes: 20
    services:
      postgres:
        # ★일반 postgres:16 은 마이그레이션에서 죽는다 — pgmq 확장이 필요하다 (ADR 2026-05-22).
        image: quay.io/tembo/pg16-pgmq:latest
        env:
          POSTGRES_DB: bts
          POSTGRES_USER: bts
          POSTGRES_PASSWORD: bts
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U bts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: 조립 부팅
        working-directory: backend
        env:
          BTS_DB_URL: jdbc:postgresql://localhost:5433/bts
        run: ./gradlew :modules:app:test --console=plain
