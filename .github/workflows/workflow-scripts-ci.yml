# 워크플로우 스크립트 판별식 CI — 하드코딩 목록끼리의 정합을 강제하는 봉인을 돌린다
#
# 종수를 여기 적지 않는다. 2026-08-13 까지 「6종」이라고 적혀 있었지만 아래 표는 이미 9행이었다 —
# 사람이 세는 숫자와 실제 목록이 갈라지는, 이 저장소가 가장 자주 밟는 양식이다.
# 정본은 `pnpm test:workflow` 가 훑는 `scripts/**/*.test.{ts,mjs}` 실물이다.
#
# 왜 별도 워크플로우인가. 2026-07-27 에 이 잡을 `backend-ci.yml` 안에 만들었는데,
# 2026-07-30 self-hosted 전환에서 그 배치가 문제가 됐다. `paths` 는 **워크플로우 레벨**이라
# 잡별 필터가 없다 — 판별식 입력(워크플로우 파일 · FR 문서 · 스킬 분기표)을 backend-ci 트리거에
# 얹으면 그 파일 한 줄 고치는 PR 이 **backend 12잡을 전부 끌고 온다**. 러너 1대에서 50~60분이다.
# 판별식 자체는 2분이면 끝난다. 그래서 트리거를 판별식 입력에 맞춰 분리했다.
#
# ## ★ 이 트리거 목록은 판별식 전량의 **입력 합집합**이다
# 하나라도 빠지면 그 입력만 바꾸는 PR 에서 해당 판별식이 **0회 실행**되고 통과한다 —
# 판별식을 무력화하는 PR 이 정확히 그 결함을 만드는 PR 이라 가장 나쁜 사각이다(#323 에서 실증).
#
# | 판별식 | 읽는 입력 | 아래 경로 |
# |---|---|---|
# | bc-keyword-coverage            | docs/plan/product/*.md                   | docs/plan/product/** |
# | ci-module-coverage             | backend/settings.gradle.kts · backend/modules/*/build.gradle.kts · backend-ci | backend/settings.gradle.kts · backend/modules/*/build.gradle.kts · .github/workflows/** |
# | preview-cors-origin-alignment  | vite/playwright config · app application.yml · 이 파일 | 각 경로 |
# | skill-type-coverage            | scripts/workflow/types.ts · bts-review-plan/SKILL.md | scripts/workflow/** · .claude/skills/** |
# | todos-resolved-section-purity  | TODOS.md                                 | TODOS.md |
# | ci-runner-label-alignment      | .github/workflows/*.yml                  | .github/workflows/** |
# | worktree-hook-wiring           | .gitignore · .husky/pre-commit · .lintstagedrc.json · apps/web/.lintstagedrc.json · bts-start·bts-impl SKILL | .gitignore · .husky/** · .lintstagedrc.json · apps/web/.lintstagedrc.json · .claude/skills/** |
# | doc-index-coverage             | docs/** · scripts/doc-index/** · 이 파일  | docs/** · scripts/doc-index/** |
# | tier-floor                     | scripts/workflow/surfaces.ts · docs/plans/*.md · PR 변경 파일 | scripts/workflow/** · docs/** |
# | agent-name-coverage            | scripts/workflow/types.ts · .claude/agents/*.md | scripts/workflow/** · .claude/agents/** |
# | snapshot-baseline-guard        | PR 변경 파일 (baseline PNG ⟺ apps/web/src/**) | ⚠ 아래 「덮지 못하는 입력」 참조 |
# | verify-master-plan.sh (잡)     | docs/sdd/02-requirements.md · docs/plan/** · CLAUDE.md · DEVELOPMENT.md · CHANGELOG.md · docs/rules/behavior-rules.md · scripts/workflow/surfaces.ts | docs/** · CLAUDE.md · DEVELOPMENT.md · CHANGELOG.md · scripts/workflow/** |
#
# ## ★ 하네스 정본 3경로는 2026-08-13 에 **처음** 걸렸다
# `CLAUDE.md` · `DEVELOPMENT.md` · `CHANGELOG.md` 는 그전까지 5개 워크플로우 어느 `paths` 에도
# 없었다(전수 grep 0건). `verify-master-plan.sh` 의 룰 E·I 가 정확히 그 세 파일을 읽는데,
# 그 스크립트를 부르는 곳이 `bts-merge` 스킬 본문 1곳뿐이라 **정본을 고치는 PR 에서 검증이
# 0회 실행**됐다. 잡 승격(아래 verify-master-plan)과 이 세 경로는 같은 커밋에서 함께 들어간다 —
# 한쪽만 있으면 봉인이 절반이다.
# `.claude/agents/**` 도 같은 이유로 추가했다(agent-name-coverage 판별식의 입력).
#
# ## 트리거로 **걸지 않는** 3경로 — 공허 트리거를 만들지 않는다
# `DATA.md` · `DESIGN.md` · `.claude/settings*.json` 은 **읽는 기계가 0건**이다(전수 grep).
# 검사할 계약이 없는 경로를 트리거로 걸면 러너만 점유하고 아무것도 못 잡는다 —
# 봉인이 자기 결함을 재생산하는 형태다. 읽는 판별식이 생기는 커밋에서 함께 추가한다.
# **이 3경로는 CI 사각으로 열어 둔다. 은폐가 아니라 기록이다.**
#
# ## ⚠ 덮지 못하는 입력 — snapshot-baseline-guard
# 이 판별식의 입력은 `apps/web/e2e/visual/__screenshots__/**` 의 baseline PNG 인데,
# 이 워크플로우는 `apps/web/**` 를 통째로 걸지 않는다(프론트 전량은 frontend-ci 소관이고,
# 여기에 걸면 프론트 PR 마다 판별식 잡이 함께 서서 러너 1대 큐를 늘린다).
# ⇒ **PNG 만 바꾸는 PR 에서는 이 판별식이 0회 실행된다.** 알고 남기는 구멍이다.
#
# `docs/plan/product/**` 는 2026-08-01 `docs/**` 로 넓혔다 — doc-index 판별식이 docs 전역
# (plans·specs·decisions·adr)을 읽기 때문이다. 좁은 경로를 남겨두면 그 상위만 바꾸는 PR 에서
# 판별식이 0회 실행된다. 이 정합은 이제 doc-index-coverage 의 룰 L 이 기계로 검사한다 —
# SOURCES 에 디렉토리를 추가하고 여기 paths 를 안 고치면 CI 가 빨간불이 된다.
#
# `docs/plan/product/**` 와 `.claude/skills/**` 는 2026-07-30 이전까지 **어느 워크플로우도
# 걸지 않던 선재 갭**이었다. #320 이 그 사각을 실증했다 — docs/** 와 apps/web/** 만 건드려
# 판별식이 아예 안 돌았다.
#
# ## 러너 — self-hosted (`bts-local`)
# 2026-07-29 17:32 KST 부터 GitHub Actions 결제 차단으로 `ubuntu-latest` 잡이 배정조차 되지 않는다
# (`steps=0` · 어노테이션 "recent account payments have failed or your spending limit needs to be
# increased"). self-hosted 러너는 이 차단을 받지 않는다 — 확인 사격 run 30508738275 에서 실증.
# 러너 신원과 복구 절차. docs/runbooks/self-hosted-runner.md
# 이 파일의 `runs-on` 을 되돌리면 scripts/workflow/ci-runner-label-alignment.test.ts 가 차단한다.
name: workflow-scripts-ci

on:
  pull_request:
    paths:
      # `scripts/` 전체. 이 잡이 도는 `pnpm test:workflow` 는 이제 scripts 아래 **모든**
      # 테스트 파일을 훑으므로(2026-08-10) 트리거도 같은 범위여야 한다. 좁혀 두면
      # `scripts/build-dashboard.mjs` 만 고치는 PR 에서 그 파일의 테스트가 0회 실행된다.
      # scripts/workflow/script-test-coverage.test.ts 가 이 정합을 기계로 강제한다.
      - 'scripts/**'
      # ↓ 아래 두 줄은 `scripts/**` 에 이미 덮이지만 **지우지 말 것.**
      #   `scripts/doc-index/**` 는 doc-index-coverage 룰 L-2 가 리터럴 존재를 단언한다.
      #   지우면 기계로 검사되던 보장이 암묵 보장으로 내려간다.
      - 'scripts/workflow/**'
      # runner-healthcheck-wiring 판별식이 읽는 입력.
      - 'scripts/verify-runner-health.sh'
      - '.github/workflows/**'
      - '.claude/skills/**'
      # agent-name-coverage 판별식의 입력. 2026-08-13 이전에는 어느 워크플로우에도 없었다.
      - '.claude/agents/**'
      - '.husky/**'
      - '.lintstagedrc.json'
      - 'apps/web/.lintstagedrc.json'
      - '.gitignore'
      - 'docs/**'
      - 'scripts/doc-index/**'
      # ↓ `backend/**` 를 3경로로 좁혔다 (2026-08-13). 이 워크플로우가 backend 아래에서 실제로
      #   읽는 것은 이 셋뿐이다 — ci-module-coverage 의 Gradle 모듈 목록 2종과
      #   preview-cors-origin-alignment 의 CORS 오리진 1종. 나머지 `backend/**` 는 이 잡의
      #   결과에 아무 영향이 없는데, 러너가 1대라 backend PR 마다 판별식 잡이 큐에 함께 서서
      #   backend-ci 의 대기 꼬리를 늘렸다.
      #   ★넓히거나 좁힐 때는 preview-cors-origin-alignment.test.ts 의 `INPUTS.coveredBy` 와
      #     ci-module-coverage.test.ts 의 입력 선언을 **같은 커밋에서** 고친다. 따로 두면
      #     판별식이 엉뚱한 경로를 보며 통과한다.
      - 'backend/settings.gradle.kts'
      - 'backend/modules/*/build.gradle.kts'
      - 'backend/modules/app/src/main/resources/application.yml'
      - 'apps/web/vite.config.ts'
      - 'apps/web/playwright.config.ts'
      - 'apps/web/package.json'
      - 'TODOS.md'
      # ↓ 하네스 정본 3종 — verify-master-plan 잡의 입력 (룰 E · 룰 I).
      - 'CLAUDE.md'
      - 'DEVELOPMENT.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    # ★양쪽 블록에 같은 목록. 한쪽만 걸면 봉인이 절반만 닫힌다 —
    #  PR 에서는 돌고 main 직접 push 에서는 안 도는 상태가 된다.
    paths:
      # `scripts/` 전체 — pull_request 블록과 **같은 목록**이어야 한다.
      - 'scripts/**'
      # ↓ `scripts/**` 에 덮이지만 지우지 말 것 (룰 L-2 가 리터럴을 단언한다).
      - 'scripts/workflow/**'
      # runner-healthcheck-wiring 판별식이 읽는 입력.
      - 'scripts/verify-runner-health.sh'
      - '.github/workflows/**'
      - '.claude/skills/**'
      # agent-name-coverage 판별식의 입력. pull_request 블록과 **같은 목록**이어야 한다.
      - '.claude/agents/**'
      - '.husky/**'
      - '.lintstagedrc.json'
      - 'apps/web/.lintstagedrc.json'
      - '.gitignore'
      - 'docs/**'
      - 'scripts/doc-index/**'
      # ↓ `backend/**` 3경로 축소 — 근거는 pull_request 블록 주석 참조. 양쪽이 같아야 한다.
      - 'backend/settings.gradle.kts'
      - 'backend/modules/*/build.gradle.kts'
      - 'backend/modules/app/src/main/resources/application.yml'
      - 'apps/web/vite.config.ts'
      - 'apps/web/playwright.config.ts'
      - 'apps/web/package.json'
      - 'TODOS.md'
      # ↓ 하네스 정본 3종 — verify-master-plan 잡의 입력 (룰 E · 룰 I).
      - 'CLAUDE.md'
      - 'DEVELOPMENT.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'pnpm-lock.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 러너 엔진 점검 — 모든 잡의 선행. 엔진이 없으면 아래 잡은 Checkout 에서 죽는다.
  runner-health:
    uses: ./.github/workflows/runner-health.yml

  discriminants:
    name: 워크플로우 스크립트 판별식
    needs: runner-health
    runs-on: [self-hosted, bts-local]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ★얕은 복제면 `origin/main` 이 없어 `changed-paths.ts` 의 3순위(병합기점)가 죽는다.
          #   tier-floor·snapshot-baseline-guard 는 「이 PR 이 무엇을 바꿨나」를 입력으로 받으므로
          #   입력을 못 구하면 throw 한다(부재를 0건으로 바꾸면 하한 검사가 공허하게 통과한다).
          #   2026-08-13 PR #380 에서 실제로 red 가 났고, 그 red 가 배선 누락을 잡아냈다.
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node 22 (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: 판별식 (BC 키워드 · 스킬 분기표 · CI 매트릭스 · 러너 라벨 · CORS · TODOS)
        run: pnpm test:workflow
        env:
          # `changed-paths.ts` 2순위. PR 이면 base.sha, push 면 직전 커밋.
          # 3순위(병합기점)보다 먼저 잡혀 fork·force-push 에서도 같은 답을 준다.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          GITHUB_SHA: ${{ github.sha }}

  # ── 정본 카운트·정합 봉인 (2026-08-13 CI 승격) ──────────────────────────────
  #
  # 왜 이제야. `scripts/verify-master-plan.sh` 는 EXIT 4 로 카운트 drift 를 막는 이 저장소의
  # **유일한 차단 게이트**인데, 2026-08-13 전수 확인 시점까지 CI 배선이 **0건**이었다.
  # 부르는 곳이 `bts-merge` 스킬 본문과 리뷰 체크리스트 산문 2곳뿐이라, 그 절차를 밟지 않은
  # PR 에서는 한 번도 돌지 않았다 — 자연어 3벌이 기계 0개를 대신하고 있었다.
  #
  # ★새 워크플로우 파일을 만들지 않고 **잡을 얹는다.** runner-healthcheck-wiring.test.ts 가
  #   「헬스체크 호출자 = 자기 제외 전 워크플로우」를 하한과 함께 세기 때문에, 파일을 늘리면
  #   그 하한·배선 단언까지 같은 커밋에서 손봐야 한다. 잡 추가는 그 계약을 건드리지 않는다.
  #
  # ★입력이 `paths` 에 있어야 비-공허하다. `CLAUDE.md`·`DEVELOPMENT.md`·`CHANGELOG.md` 를
  #   위에서 함께 걸었다 — 정본을 고치는 바로 그 PR 에서 이 잡이 도는 것이 계약이다.
  #
  # 실행 2.78초(2026-08-13 실측). node·pnpm 을 쓰지 않으므로 셋업 스텝이 없다.
  verify-master-plan:
    name: 정본 카운트·정합 (EXIT 4 차단)
    needs: runner-health
    runs-on: [self-hosted, bts-local]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 마스터 계획 검증 (FR 카운트 · 체크박스 마커 · 정본 정합 룰)
        run: bash scripts/verify-master-plan.sh
