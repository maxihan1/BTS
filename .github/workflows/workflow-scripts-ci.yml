# 워크플로우 스크립트 판별식 CI — 하드코딩 목록끼리의 정합을 강제하는 봉인 6종을 돌린다
#
# 왜 별도 워크플로우인가. 2026-07-27 에 이 잡을 `backend-ci.yml` 안에 만들었는데,
# 2026-07-30 self-hosted 전환에서 그 배치가 문제가 됐다. `paths` 는 **워크플로우 레벨**이라
# 잡별 필터가 없다 — 판별식 입력(워크플로우 파일 · FR 문서 · 스킬 분기표)을 backend-ci 트리거에
# 얹으면 그 파일 한 줄 고치는 PR 이 **backend 12잡을 전부 끌고 온다**. 러너 1대에서 50~60분이다.
# 판별식 자체는 2분이면 끝난다. 그래서 트리거를 판별식 입력에 맞춰 분리했다.
#
# ## ★ 이 트리거 목록은 판별식 6종의 **입력 합집합**이다
# 하나라도 빠지면 그 입력만 바꾸는 PR 에서 해당 판별식이 **0회 실행**되고 통과한다 —
# 판별식을 무력화하는 PR 이 정확히 그 결함을 만드는 PR 이라 가장 나쁜 사각이다(#323 에서 실증).
#
# | 판별식 | 읽는 입력 | 아래 경로 |
# |---|---|---|
# | bc-keyword-coverage            | docs/plan/product/*.md                   | docs/plan/product/** |
# | ci-module-coverage             | backend/settings.gradle.kts · backend-ci | backend/** · .github/workflows/** |
# | preview-cors-origin-alignment  | vite/playwright config · app application.yml · 이 파일 | 각 경로 |
# | skill-type-coverage            | scripts/workflow/types.ts · bts-review-plan/SKILL.md | scripts/workflow/** · .claude/skills/** |
# | todos-resolved-section-purity  | TODOS.md                                 | TODOS.md |
# | ci-runner-label-alignment      | .github/workflows/*.yml                  | .github/workflows/** |
# | worktree-hook-wiring           | .gitignore · .husky/pre-commit · .lintstagedrc.json · apps/web/.lintstagedrc.json · bts-start·bts-impl SKILL | .gitignore · .husky/** · .lintstagedrc.json · apps/web/.lintstagedrc.json · .claude/skills/** |
# | doc-index-coverage             | docs/** · scripts/doc-index/** · 이 파일  | docs/** · scripts/doc-index/** |
#
# `docs/plan/product/**` 는 2026-08-01 `docs/**` 로 넓혔다 — doc-index 판별식이 docs 전역
# (plans·specs·decisions·adr)을 읽기 때문이다. 좁은 경로를 남겨두면 그 상위만 바꾸는 PR 에서
# 판별식이 0회 실행된다. 이 정합은 이제 doc-index-coverage 의 룰 L 이 기계로 검사한다 —
# SOURCES 에 디렉토리를 추가하고 여기 paths 를 안 고치면 CI 가 빨간불이 된다.
#
# `docs/plan/product/**` 와 `.claude/skills/**` 는 2026-07-30 이전까지 **어느 워크플로우도
# 걸지 않던 선재 갭**이었다. #320 이 그 사각을 실증했다 — docs/** 와 apps/web/** 만 건드려
# 판별식이 아예 안 돌았다.
#
# ## 러너 — self-hosted (`bts-local`)
# 2026-07-29 17:32 KST 부터 GitHub Actions 결제 차단으로 `ubuntu-latest` 잡이 배정조차 되지 않는다
# (`steps=0` · 어노테이션 "recent account payments have failed or your spending limit needs to be
# increased"). self-hosted 러너는 이 차단을 받지 않는다 — 확인 사격 run 30508738275 에서 실증.
# 러너 신원과 복구 절차. docs/runbooks/self-hosted-runner.md
# 이 파일의 `runs-on` 을 되돌리면 scripts/workflow/ci-runner-label-alignment.test.ts 가 차단한다.
name: workflow-scripts-ci

on:
  pull_request:
    paths:
      - 'scripts/workflow/**'
      - '.github/workflows/**'
      - '.claude/skills/**'
      - '.husky/**'
      - '.lintstagedrc.json'
      - 'apps/web/.lintstagedrc.json'
      - '.gitignore'
      - 'docs/**'
      - 'scripts/doc-index/**'
      - 'backend/**'
      - 'apps/web/vite.config.ts'
      - 'apps/web/playwright.config.ts'
      - 'apps/web/package.json'
      - 'TODOS.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    # ★양쪽 블록에 같은 목록. 한쪽만 걸면 봉인이 절반만 닫힌다 —
    #  PR 에서는 돌고 main 직접 push 에서는 안 도는 상태가 된다.
    paths:
      - 'scripts/workflow/**'
      - '.github/workflows/**'
      - '.claude/skills/**'
      - '.husky/**'
      - '.lintstagedrc.json'
      - 'apps/web/.lintstagedrc.json'
      - '.gitignore'
      - 'docs/**'
      - 'scripts/doc-index/**'
      - 'backend/**'
      - 'apps/web/vite.config.ts'
      - 'apps/web/playwright.config.ts'
      - 'apps/web/package.json'
      - 'TODOS.md'
      - 'package.json'
      - 'pnpm-lock.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discriminants:
    name: 워크플로우 스크립트 판별식
    runs-on: [self-hosted, bts-local]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node 22 (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: 판별식 (BC 키워드 · 스킬 분기표 · CI 매트릭스 · 러너 라벨 · CORS · TODOS)
        run: pnpm test:workflow
