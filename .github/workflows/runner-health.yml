# 러너 실행 엔진(node · java) 생존을 checkout 앞에서 확인하는 재사용 워크플로우
#
# 왜 이 워크플로우가 있나. 2026-08-04 18:18 홈 폴더 대용량 파일 정리로 self-hosted 러너의
# 실행 엔진 4개(externals/node20 · externals/node24 · 툴캐시 node · 툴캐시 JDK 의 lib/modules)가
# 지워져 **8/4~8/7 사흘간 CI 가 0회 실행**됐다. 러너는 `online` 이었고 빨간불도 떴지만
# 실패가 `Checkout` 스텝에서 났기 때문에 「테스트가 깨졌다」와 구분되지 않았고,
# 그 사이 #342 · #343 · #344 가 검증 없이 머지됐다.
#
# ## ★ 왜 재사용 워크플로우인가 — 인라인 복사본을 피하려고
#
# 헬스체크는 `actions/checkout` **앞**에 있어야 한다. JavaScript 액션은 node 로 돌아가므로
# node 가 없으면 checkout **자체가** 죽고, checkout 이후 스텝은 이 결함을 절대 못 본다.
# 그런데 그 시점엔 저장소가 아직 없어 `scripts/verify-runner-health.sh` 를 부를 수 없다.
# 각 잡에 인라인으로 넣으면 **11개 복사본**이 되고 동기화 강제가 주석 한 줄로 전락한다
# (PR #345 에서 없앤 바로 그 양식). 호출로 만들어 인라인 셸을 **저장소 전체에 1벌**만 둔다.
#
# ## ⚠️ 이 워크플로우의 전제 2건은 미검증이다
#
# 1. 순수 shell `run:` 스텝은 node 부재 시에도 실행된다
# 2. `workflow_call` 해석은 node 를 쓰지 않는다
#
# 완전 실측은 러너를 일부러 고장내야 하므로 하지 않았다(운영 중 CI 를 끊는다). 근거는 정황이다 —
# 사고 기간 실패 run 에서 `Set up job` 은 전부 완료됐고 에러가 `Checkout` 스텝에 귀속됐으며,
# `_diag` Worker 로그에 `NodeScriptActionHandler` 가 Checkout 앞뒤 2회만 등장한다(스텝 단위 해석).
# 그래서 `scripts/verify-runner-health.sh` + `/bts-start` Step 0 배선이 **전제 무관 백스톱**으로
# 함께 있다. 배선은 `scripts/workflow/runner-healthcheck-wiring.test.ts` 가 강제한다.
#
# 정본 문서. docs/runbooks/self-hosted-runner.md §4
name: runner-health

on:
  workflow_call:

jobs:
  check:
    name: 러너 엔진 점검
    runs-on: [self-hosted, bts-local]
    timeout-minutes: 3
    steps:
      # ★ 반드시 순수 shell 이다. `uses:` 를 쓰면 그 액션을 돌리는 데 node 가 필요해
      #   정확히 이 결함 상황에서 이 잡이 먼저 죽고 진단이 사라진다.
      #   내용은 scripts/verify-runner-health.sh 와 같은 판정을 하되, 저장소가 없는 시점이라
      #   파일을 부를 수 없어 인라인이다. 두 곳이 갈라지지 않도록 판정 규칙을 여기 못박는다 —
      #   「파일 존재가 아니라 실행 성공(exit 0)」 · 「글로브는 바이너리가 아니라 버전 디렉터리」.
      - name: 러너 엔진 점검 (node · java)
        run: |
          ROOT="$HOME/actions-runner-bts"
          FAILED=0
          shopt -s nullglob

          report() { echo "❌ $1"; echo "   복구. $2"; FAILED=1; }

          # 다섯째 인자(완료 표식)가 주어지면 「표식 게이팅」. 표식이 **있는데** 실행이 안 되는
          # 상태만 실패다 — setup-* 가 그 표식을 캐시 히트로 오판해 조용히 흘러내리는 상태.
          # 표식이 **없으면** 어차피 캐시 미스로 자가 재설치되므로 경고만 남긴다.
          # 여기서 실패시키면 재설치를 수행할 바로 그 잡을 막아 영원히 초록이 될 수 없다
          # (실측. run 31139123013 에서 실제로 교착이 났고 이 규칙이 그 봉합이다).
          check_exec() {
            local label="$1" bin="$2" flag="$3" fix="$4" marker="${5:-}"
            if [ ! -e "$bin" ] || ! "$bin" "$flag" >/dev/null 2>&1; then
              local why="바이너리 부재"
              [ -e "$bin" ] && why="파일은 있으나 실행 실패"
              if [ -n "$marker" ] && [ ! -e "$marker" ]; then
                echo "⚠️  $label — $why ($bin)"
                echo "   완료 표식이 이미 없다 → setup-* 가 자가 재설치한다. 차단하지 않는다."
                return
              fi
              report "$label — $why ($bin)" "$fix"; return
            fi
            echo "✅ $label"
          }

          FIX_EXTERNALS="nodejs.org 공식 배포본을 SHASUMS256.txt 로 sha256 대조 후 bin/node 만 복원"
          FIX_TOOLCACHE="그 버전 디렉터리의 arm64.complete 표식 삭제 → setup-* 가 자가 재설치"

          for v in node20 node24; do
            check_exec "externals/$v" "$ROOT/externals/$v/bin/node" -v "$FIX_EXTERNALS"
          done

          # ★ 글로브를 바이너리 경로(`*/*/bin/node`)에 걸면 바이너리가 지워지는 바로 그 순간
          #   0건이 되어 루프가 안 돌고 조용히 통과한다. 버전 디렉터리를 훑는다.
          # 완료 표식은 `<버전>/<arch>.complete` — arch 디렉터리 경로에서 끝의 `/` 를 뗀 것.
          for dir in "$ROOT"/_work/_tool/node/*/*/; do
            check_exec "toolcache node ($(basename "$(dirname "$dir")"))" \
              "${dir}bin/node" -v "$FIX_TOOLCACHE" "${dir%/}.complete"
          done

          for dir in "$ROOT"/_work/_tool/Java_*/*/*/; do
            check_exec "toolcache java ($(basename "$(dirname "$dir")"))" \
              "${dir}Contents/Home/bin/java" -version "$FIX_TOOLCACHE" "${dir%/}.complete"
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "─────────────────────────────────────────"
            echo "러너 환경 결함 — 코드 문제 아님"
            echo "이 run 의 테스트는 한 줄도 실행되지 않는다."
            echo "docs/runbooks/self-hosted-runner.md §4"
            echo "─────────────────────────────────────────"
            exit 1
          fi
          echo "러너 엔진 정상."

      # ── 자원 고갈 점검 — 엔진이 정상인데도 CI 가 2배 이상 느려지는 상태 ──────────
      #
      # ★위 엔진 점검은 이 상태를 **전부 통과시킨다.** 바이너리가 멀쩡히 실행되기 때문이다.
      # 2026-08-07 A/B 확증 — 동일 커밋 run 31139616352 를 `gh run rerun --job` 으로 재실행.
      #   issue-tracking   1,380s (swap 15,014M · load 34.43) → 554s (swap 3,556M · load 7.72)
      #   identity-access    739s                             → 384s
      #   테스트 케이스 수는 3,247 → 3,247 로 증감 0. 코드가 아니라 머신이었다.
      # 이 감속은 **초록불인 채** 일어나므로 사람이 「오늘 좀 느리네」로 넘긴다.
      #
      # ★★경고만 한다. 이 스텝은 절대 실패하지 않는다.
      # 자원 회복은 사람이 해야 하는데 차단하면 회복 작업까지 멈춘다 — 위 엔진 점검의
      # 「표식이 이미 없으면 경고」와 같은 구조의 교착이고, 그 실측이 run 31139123013 이다.
      #
      # ★판정 규칙은 scripts/verify-runner-health.sh 와 **동형**이어야 한다.
      # 구조상 dedup 이 불가능한 두 복사본이고(이 잡은 checkout 앞이라 저장소 파일을 못 부른다),
      # runner-healthcheck-wiring.test.ts 의 INVARIANTS 가 갈라짐을 차단한다.
      - name: 러너 자원 점검 (경고 전용)
        run: |
          LOAD_RATIO_WARN=2.0   # 실측 — 고갈 4.30 (34.43/8코어) · 정상 0.97 (7.72/8코어)
          SWAP_RATIO_WARN=0.5   # 실측 — 고갈 0.916 (15,014M/16GB) · 정상 0.217 (3,556M/16GB)

          # ★둘 다 「비율」이다. 절대값을 쓰면 러너를 다른 머신으로 바꾸는 순간 같은 값이
          #   다른 의미가 되는데 아무도 눈치채지 못한다.
          NCPU="${BTS_RUNNER_FAKE_NCPU:-$(sysctl -n hw.ncpu 2>/dev/null || true)}"
          LOAD="${BTS_RUNNER_FAKE_LOAD:-$(uptime 2>/dev/null | sed 's/.*averages*: *//' | awk '{print $1}')}"
          SWAP_MB="${BTS_RUNNER_FAKE_SWAP_MB:-$(sysctl -n vm.swapusage 2>/dev/null | sed 's/.*used = //; s/M.*//')}"
          MEM_MB="${BTS_RUNNER_FAKE_MEM_MB:-$(sysctl -n hw.memsize 2>/dev/null | awk '{ printf "%.0f", $1 / 1048576 }')}"

          if [ -z "$NCPU" ] || [ -z "$LOAD" ] || [ -z "$SWAP_MB" ] || [ -z "$MEM_MB" ]; then
            # macOS 전용 명령이다. 다른 OS 로 러너를 옮기면 여기로 떨어진다 —
            # 조용히 통과하지 않고 「판정을 못 했다」를 남긴다.
            echo "⚠️  자원 판정 건너뜀 — 측정 실패 (sysctl/uptime 은 macOS 기준이다)"
            exit 0
          fi

          LOAD_RATIO=$(awk -v l="$LOAD" -v n="$NCPU" 'BEGIN { printf "%.2f", (n > 0 ? l / n : 0) }')
          SWAP_RATIO=$(awk -v s="$SWAP_MB" -v m="$MEM_MB" 'BEGIN { printf "%.3f", (m > 0 ? s / m : 0) }')
          OVER=$(awk -v r="$LOAD_RATIO" -v w="$LOAD_RATIO_WARN" -v sr="$SWAP_RATIO" -v sw="$SWAP_RATIO_WARN" \
            'BEGIN { print (r >= w || sr >= sw) ? 1 : 0 }')

          if [ "$OVER" -eq 1 ]; then
            echo "⚠️  러너 자원 고갈 — load ${LOAD}/${NCPU}코어 = ${LOAD_RATIO}배 · swap ${SWAP_MB}/${MEM_MB}MB = ${SWAP_RATIO}"
            echo "   이 run 의 테스트는 2배 이상 느려진다. 이 run 의 소요 시간을 믿지 마라."
            echo "   실측. 2026-08-07 동일 커밋 A/B — issue-tracking 1380s ↔ 554s (테스트 수 증감 0)"
            echo "   차단하지 않는다 — 회복은 사람이 하고, 막으면 회복 작업까지 멈춘다."
            echo "   진단. top -l 1 -o mem -n 10   (docker system df 가 아니라 이쪽을 먼저 본다)"
          else
            echo "✅ 러너 자원 (load ${LOAD_RATIO}배 · swap ${SWAP_RATIO})"
          fi

          # ★이 스텝은 어떤 경우에도 성공으로 끝난다. 위 ★★ 주석 참조.
          exit 0
