# .github/workflows/backend-ci.yml — BTS 백엔드 CI (BC 모듈 병렬 + 조립 부팅 별도 잡)
#
# 왜 필요한가. 2026-07-27 실측 시점까지 **백엔드 테스트 10,036건이 CI 에서 한 번도 돌지 않았다.**
# 머지 검증이 전적으로 로컬 수동 실행에 의존했다 — 로컬을 건너뛴 PR 하나가 그대로 main 에 들어간다.
# (`infra-ci.yml` 이 `backend/**` 를 경로 트리거로 걸고 있어 "백엔드도 CI 가 있다" 로 오인하기 쉬우나,
#  그 워크플로우가 돌리는 것은 nginx·springdoc 봉인 스크립트뿐이고 Gradle 테스트는 0건이다.)
#
# ## 잡 구조 — 왜 모듈별로 쪼개나
# 전체 스위트는 로컬 M-series 에서 33분이다(2026-07-27 실측). 단일 잡으로 두면 PR 피드백이 그만큼 늦고,
# 한 모듈이 실패해도 나머지 결과를 못 본다. 그래서 BC 모듈을 매트릭스로 쪼갠다 —
# 이득은 **실패 범위 분리**이지 벽시계 단축이 아니다.
# ★2026-08-13 정정. 「벽시계가 최장 모듈 수준으로 수렴한다」는 러너가 여러 대일 때만 참이다.
#   이 저장소는 self-hosted 러너 1대라 매트릭스가 직렬로 서고, 벽시계 ≒ 잡 합계가 된다
#   (실측 run 31594550190 — 잡 합계 34.8분 · 벽시계 39.8분). 아래 timeout 주석 참조.
#
# ## 두 종류의 DB 의존을 구분한다
#  1. **Testcontainers** (428 파일) — 러너 기본 Docker 로 스스로 컨테이너를 띄운다. 별도 DB 불요.
#  2. **외부 postgres** (10 파일, `:modules:app` 조립 부팅) — `ProdAssemblyHttpTestBase` 가
#     Testcontainers 를 관리하지 않고 `application.yml` 의 datasource 설정을 그대로 쓴다.
#     ⇒ **이 잡에만** postgres 를 띄운다(`docker run` 스텝, 아래 assembly 잡 주석 참조).
#
# ## ★ postgres 이미지를 바꾸지 마라
# 반드시 `quay.io/tembo/pg16-pgmq` 여야 한다. 일반 `postgres:16` 에는 pgmq 확장이 없어
# 조립 부팅이 마이그레이션 단계에서 실패한다 (ADR `docs/adr/2026-05-22-pgmq-postgres-image.md`).
# 포트는 **55433:5432** 이고 `BTS_DB_URL` 이 그 짝이다 — 한쪽만 바꾸면 조용히 못 붙는다.
# (5433 이 아닌 이유는 assembly 잡 주석에 있다 — 러너 머신의 dev postgres 가 그 포트를 쓴다.)
#
# ## 러너 — self-hosted (`bts-local`)
# 2026-07-29 17:32 KST 부터 GitHub Actions 결제 차단으로 `ubuntu-latest` 잡이 배정조차 되지 않는다
# (`steps=0` · 어노테이션 "recent account payments have failed or your spending limit needs to be
# increased"). self-hosted 러너는 이 차단을 받지 않는다 — 확인 사격 run 30508738275 에서 실증.
# 러너 신원과 복구 절차. docs/runbooks/self-hosted-runner.md
# 이 파일의 `runs-on` 을 되돌리면 scripts/workflow/ci-runner-label-alignment.test.ts 가 차단한다.
name: backend-ci

# ## 트리거는 이 워크플로우가 **실제로 실행하는 것**만 건다
# 테스트 잡은 전부 `./gradlew` 다. 예외가 **하나** 있다 — `select` 잡이 node 로
# `scripts/workflow/select-backend-modules.ts` 를 돌려 어떤 모듈을 테스트할지 고른다
# (2026-08-12 · 부채 매핑 31). 그래서 그 **파일 하나만** 아래 `paths` 에 함께 걸려 있다.
#
# 2026-08-01 이전에는 `scripts/workflow/**` · `apps/web/vite.config.ts` ·
# `apps/web/playwright.config.ts` · `package.json` 이 함께 걸려 있었다. 판별식이 backend-ci 에서
# 돌던 시절(~2026-07-30)의 잔재로, 판별식을 `workflow-scripts-ci.yml` 로 옮기면서 트리거만
# 정리되지 않은 것이다. 그 경로들은 이 워크플로우의 잡 결과에 아무 영향이 없다.
#
# 비용은 실측됐다. PR #329(문서 인덱싱)는 backend 를 한 줄도 안 건드렸는데
# `scripts/workflow/` 에 판별식 파일 하나를 추가한 것만으로 12잡을 전부 끌고 왔다
# (러너 1대 직렬, 33분 스위트가 50~60분).
#
# 판별식이 계속 도는지는 그대로다 — `workflow-scripts-ci.yml` 의 트리거가
# `backend/**` · `.github/workflows/**` · `apps/web/vite.config.ts` ·
# `apps/web/playwright.config.ts` · `package.json` 을 이미 전부 덮는다.
# 되돌리면 `scripts/workflow/ci-runner-label-alignment.test.ts` 가 차단한다.
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      # ★이 잡이 **실행하는** 선별기다. 빠지면 「선별기를 너무 좁게 고치는 PR」에서
      #   backend-ci 가 0회 돌아, 무엇을 돌릴지 정하는 코드가 백엔드 잡으로 한 번도
      #   검증되지 않는다. 글로브가 아니라 이 파일 하나만 건다 —
      #   `scripts/workflow/**` 를 통째로 넣으면 판별식 파일 추가만으로 12잡을 끌고 온다.
      - 'scripts/workflow/select-backend-modules.ts'
  push:
    branches: [main]
    # ★양쪽 블록에 같은 목록. 한쪽만 걸면 봉인이 절반만 닫힌다.
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      # ★이 잡이 **실행하는** 선별기다. 빠지면 「선별기를 너무 좁게 고치는 PR」에서
      #   backend-ci 가 0회 돌아, 무엇을 돌릴지 정하는 코드가 백엔드 잡으로 한 번도
      #   검증되지 않는다. 글로브가 아니라 이 파일 하나만 건다 —
      #   `scripts/workflow/**` 를 통째로 넣으면 판별식 파일 추가만으로 12잡을 끌고 온다.
      - 'scripts/workflow/select-backend-modules.ts'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 러너 엔진 점검 — 모든 잡의 선행. 엔진이 없으면 아래 잡은 Checkout 에서 죽는다 ──
  runner-health:
    uses: ./.github/workflows/runner-health.yml
    # ★이 워크플로우는 Docker 데몬을 쓴다 — Testcontainers 가 컨테이너를 직접 띄우고
    #   generateJooq 도 DB 컨테이너를 요구한다. 데몬이 꺼지면 잡 12개가 줄줄이 오진 실패하고
    #   사람이 하나씩 로그를 판다(2026-08-12 PR #367 실측 — 그날 실제로 치른 비용이다).
    #   이 플래그를 손으로 관리하지 않는다 — runner-healthcheck-wiring.test.ts 가 실제
    #   docker 사용을 훑어 양방향(누락·과잉)으로 강제한다.
    with:
      require_docker: true

  # ── 어떤 모듈을 돌릴지 고른다 (2026-08-12 · 부채 매핑 31) ─────────────────────
  #
  # 왜. 종전에는 `matrix.module` 이 9개 고정 목록이라 백엔드 파일이 하나만 바뀌어도 전부 돌았다.
  # 2026-08-12 PR #367 실측 — KDoc 한 덩어리(실행 코드 0줄)가 잡 12개를 깨웠고 러너가 1대라
  # 직렬로 **약 37분**. 「매트릭스로 병렬화하면 최장 모듈로 수렴」이라는 설계 전제는 러너가
  # 여러 대일 때만 성립한다.
  #
  # ★두 방향의 비용이 대칭이 아니다. 넓게 고르면 시간만 들지만 **좁게 고르면 검증 안 된 코드가
  #   초록으로 머지된다.** 그래서 판정을 못 하는 모든 경우(변경 목록 획득 실패 · 모듈 밖 백엔드
  #   변경 · 이 워크플로우 자신의 변경)의 기본값은 **전 모듈**이다.
  #
  # ★의존 그래프는 손으로 안 적는다 — `build.gradle.kts` 의 `project(":modules:X")` 에서
  #   런타임에 도출한다. 판별식. scripts/workflow/select-backend-modules.test.ts
  select:
    name: 대상 모듈 선별
    needs: runner-health
    runs-on: [self-hosted, bts-local]
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.pick.outputs.modules }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 변경 파일을 구하려면 비교 대상 커밋이 로컬에 있어야 한다. 얕은 클론이면
          # diff 가 실패하고, 그러면 아래가 fail-safe 로 **전 모듈**을 고른다(안전하지만 느리다).
          fetch-depth: 0

      # ★다른 워크플로우와 같은 node 를 쓴다. 러너 PATH 의 시스템 node 에 기대면, 그 버전이
      #   22.6 미만이 되거나(--experimental-strip-types 부재) 바이너리가 쓸려 나갔을 때
      #   `runner-health` 는 초록인 채 이 잡만 죽는다 — 그 점검은 externals·툴캐시만 보고
      #   시스템 node 는 보지 않는다(2026-08-04 엔진 소실 사고의 사각).
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 변경 파일 → 대상 모듈
        id: pick
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          # ★ADR D2 — 위험이 큰 작업은 **파일 경로에 신호가 없는 유일한 조건**이라 사람이
          #   라벨(`ci:full`)로 말한다. `toJSON` 이 JSON 배열 문자열을 만들고 선별기가 그것을 읽는다.
          #   push 이벤트에는 `pull_request` 컨텍스트가 없으므로 빈 배열이 된다 — 라벨 부재는
          #   **정상 상태**이고 선별기는 그때 넓히지 않는다(모든 PR 이 전 모듈을 돌면 무의미해진다).
          BTS_CI_PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # ★diff 가 실패하면 목록을 **비운다.** 선별기는 빈 목록을 「판정 불가」로 읽고
          #   전 모듈을 돌려준다 — 모르는 상태에서 좁히지 않는다는 계약이 여기서 성립한다.
          #
          # ★`core.quotePath=false` 와 `-z` 가 **필수**다. git 기본값은 비-ASCII 경로를
          #   `"backend/…\355\225…"` 처럼 따옴표로 감싼 이스케이프 문자열로 낸다. 그 토큰은
          #   `backend/` 로 시작하지 않아 선별기의 귀속·확장 판정을 **둘 다 빠져나가 조용히
          #   무시**된다 — 좁아지는 방향이라 치명적이다. 이 저장소는 한글 명명을 자주 쓴다.
          if ! git -c core.quotePath=false diff --name-only -z \
                 "$BASE_SHA" "${{ github.sha }}" > /tmp/bts-changed.z 2> /dev/null; then
            : > /tmp/bts-changed.z
            echo "⚠️  변경 파일을 구하지 못했다 (base=$BASE_SHA) — 전 모듈을 돈다."
          fi

          # ★`xargs -a` 를 쓰지 않는다 — **GNU 전용**이고 이 러너는 macOS(BSD xargs)라
          #   `invalid option -- a` 로 죽는다(2026-08-12 실측, 이 잡이 실제로 그렇게 실패했다).
          #
          # ★★빈 입력을 xargs 에 맡기지 않는다. 입력이 비면 xargs 가 명령을 **아예 실행하지
          #   않아** `$MODULES` 가 빈 문자열이 되고, `fromJSON('')` 이 매트릭스를 깨뜨린다 —
          #   diff 실패의 fail-safe 가 정확히 그 자리에서 무너진다(2026-08-12 CI 실측).
          #   그래서 「인자 0개로 직접 부르기」를 분리해 둔다. 선별기는 인자 0개를 「판정 불가」로
          #   읽고 전 모듈을 돌려준다.
          if [ -s /tmp/bts-changed.z ]; then
            MODULES="$(xargs -0 node --experimental-strip-types \
              scripts/workflow/select-backend-modules.ts < /tmp/bts-changed.z)"
          else
            MODULES="$(node --experimental-strip-types \
              scripts/workflow/select-backend-modules.ts)"
          fi

          # ★결과 형태를 **여기서** 확인하고, 아니면 큰 소리로 죽는다.
          #   빈 값·비-배열을 그대로 넘기면 매트릭스가 스킵되는데 그것은 빨간불이 아니라
          #   **부재**다 — 장부 매핑 31 이 착수 조건으로 못박은 「조용한 0개」가 바로 그것이다.
          #   조용히 아무 잡도 안 도는 것보다 여기서 실패하는 편이 언제나 낫다.
          case "$MODULES" in
            '['*']') ;;
            *)
              echo "❌ 선별 결과가 JSON 배열이 아니다: '$MODULES'"
              echo "   그대로 넘기면 매트릭스가 조용히 스킵된다 — 여기서 멈춘다."
              exit 1
              ;;
          esac
          if [ "$MODULES" = "[]" ]; then
            echo "❌ 선별 결과가 빈 배열이다 — 선별기의 계약(어떤 입력에도 0개 금지)이 깨졌다."
            exit 1
          fi

          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"

          # ★선별 결과를 run 요약에 남긴다. 「왜 이 모듈만 돌았나」가 사후 판단의 근거이고,
          #   스텝 로그 안에만 있으면 잡을 펼쳐야 보여서 아무도 안 본다.
          : "${GITHUB_STEP_SUMMARY:=/dev/null}"
          {
            echo "### backend-ci 대상 모듈"
            echo ""
            echo "\`$MODULES\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── BC 모듈 — Testcontainers 자체 기동, 서비스 컨테이너 불요 ──────────────────
  modules:
    name: ${{ matrix.module }}
    needs: [runner-health, select]
    runs-on: [self-hosted, bts-local]
    # 관측치(2026-07-27 로컬). issue-tracking 7~10분 · identity-access 10~16분 · 나머지 5분 이하.
    # CI 러너는 로컬보다 느리므로 여유를 크게 잡는다.
    # ★2026-08-13 정정. 「매트릭스라 벽시계는 줄어든다」는 **거짓**이었다 — 러너가 1대
    #   (`maxi-mac-bts`)라 매트릭스 잡이 병렬이 아니라 **직렬**로 선다. 실측 run 31594550190
    #   에서 잡 합계 34.8분 ≒ 벽시계 39.8분으로 병렬 이득이 0 이다. 벽시계를 줄이는 수단은
    #   병렬화가 아니라 **일감 축소**(바뀐 모듈만 고르기)이고, 러너 증설은 별도 부채다.
    timeout-minutes: 45
    strategy:
      # 한 모듈이 깨져도 나머지 결과를 봐야 원인 범위를 좁힐 수 있다.
      fail-fast: false
      # ★목록을 여기 적지 않는다. `select` 잡이 변경 파일에서 계산한 것을 그대로 받는다 —
      #   적어 두면 그 목록과 `backend/modules/` 실물이 서로를 안 보는 두 목록이 된다.
      #   선별기는 **어떤 입력에도 빈 배열을 돌려주지 않는다.** 빈 매트릭스는 GitHub 이
      #   거부하고 거부된 잡은 스킵되는데, 그것은 빨간불이 아니라 **부재**라 아무도 눈치채지
      #   못한 채 초록으로 머지된다(장부 매핑 31 이 착수 조건으로 못박은 위험).
      matrix:
        module: ${{ fromJSON(needs.select.outputs.modules) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Test — :modules:${{ matrix.module }}
        working-directory: backend
        run: ./gradlew :modules:${{ matrix.module }}:test --console=plain

      # 실패 시 원인 파악에 XML 이 필요하다. 로그만으로는 어느 케이스가 깨졌는지 안 보인다.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.module }}
          path: backend/modules/${{ matrix.module }}/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 7

  # ── 조립 부팅 — 9 BC 를 한 컨텍스트에 올린다. 전용 postgres 를 스텝에서 직접 띄운다 ────
  #
  # ## ★ 왜 `services:` 블록이 아닌가 (2026-07-30 실측)
  # GitHub Actions 의 **서비스 컨테이너는 Linux 러너에서만 지원된다.** macOS 러너에서는 잡이
  # `Initialize containers` 단계에서 죽는다 — run 30514310932 에서 실측했다.
  #   ##[error]Container operations are only supported on Linux runners
  # 이미지 아키텍처 문제가 아니다(pgmq 이미지는 arm64 매니페스트를 갖는다). 기능 자체가 없다.
  #
  # **스텝 안에서의 `docker run` 은 정상 동작한다.** 같은 실행에서 infra-ci 의 nginx 봉인 잡이
  # `nginx:1.27-alpine` 을 그렇게 띄우고 통과했다(양성 대조군). 그래서 수명주기를 직접 관리한다.
  # 되돌려서 `services:` 를 다시 쓰면 ci-runner-label-alignment.test.ts 가 차단한다.
  assembly:
    name: app (조립 부팅)
    needs: runner-health
    runs-on: [self-hosted, bts-local]
    timeout-minutes: 30
    env:
      # ★5433 이 아니라 55433 인 이유. self-hosted 러너는 Maxi 의 개발 머신이고, 거기서는
      # dev postgres 컨테이너(`bts-postgres-dev`)가 **5433 을 상시 점유**한다.
      #
      # ★그렇다고 그 dev postgres 를 재사용하면 안 된다. 볼륨이 영속이라 이전 실행·수동 조작이
      # 남긴 선재 행이 그대로 있고, "마이그레이션이 안 넣음"과 "데이터 없음"이 구분되지 않아
      # 가짜 초록이 난다(learnings — 공유 dev DB 선재 행). CI 는 매번 빈 DB 로 시작해야 한다.
      #
      # application.yml:39 이 `${BTS_DB_URL:...}` 로 이미 오버라이드 지점을 갖고 있어
      # Kotlin 변경 0 으로 포트만 옮긴다. prod 배포도 같은 키를 쓴다(docker-compose.prod.yml:113).
      BTS_DB_URL: jdbc:postgresql://localhost:55433/bts
      # ★★러너를 2대 이상으로 늘리면 이 두 값을 실행별로 유일하게 만들어야 한다.
      # 이름과 포트가 고정이라, assembly 잡 두 개가 동시에 뜨면 뒤에 온 잡의 `docker rm -f` 가
      # **앞 잡의 DB 를 테스트 도중에 죽인다.** 지금은 러너 1대(D2=A)라 발생할 수 없지만,
      # 증설이 곧 이 조건을 만든다 — 증설하는 PR 에서 함께 바꿔라
      # (예: `-${{ github.run_id }}` 접미사 + `docker port` 로 동적 포트 조회 후 BTS_DB_URL 조립).
      CI_PG_CONTAINER: bts-ci-postgres
    steps:
      # ★pgmq 확장 필수 — 일반 postgres:16 으로 바꾸면 마이그레이션에서 실패한다
      # (ADR docs/adr/2026-05-22-pgmq-postgres-image.md).
      # `--rm` 없이 띄우고 always 스텝에서 지운다 — 실패해도 로그를 남기기 위해서다.
      - name: postgres(pgmq) 기동
        run: |
          docker rm -f "$CI_PG_CONTAINER" 2>/dev/null || true
          docker run -d --name "$CI_PG_CONTAINER" \
            -e POSTGRES_DB=bts -e POSTGRES_USER=bts -e POSTGRES_PASSWORD=bts \
            -p 55433:5432 \
            quay.io/tembo/pg16-pgmq:latest

      # `services:` 의 health 옵션을 대신한다. 이게 없으면 Gradle 이 아직 안 뜬 DB 에 붙어
      # "커넥션 거부" 로 죽고, 원인이 마이그레이션 실패로 오독된다.
      - name: postgres 헬스 대기
        run: |
          for i in $(seq 1 30); do
            if docker exec "$CI_PG_CONTAINER" pg_isready -U bts -d bts >/dev/null 2>&1; then
              echo "postgres ready (${i}회차)"; exit 0
            fi
            sleep 2
          done
          echo "postgres 가 60초 안에 안 떴다"; docker logs "$CI_PG_CONTAINER"; exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # 조립 부팅은 prod 프로파일 + 실 Tomcat(RANDOM_PORT)으로 서블릿 필터체인까지 태운다.
      # MockMvc 가 우회하는 것(permitAll·CSRF-ignore·멀티파트 상한)을 여기서만 잡을 수 있다.
      - name: Test — :modules:app (prod 조립 컨텍스트)
        working-directory: backend
        run: ./gradlew :modules:app:test --console=plain

      # 비-prod 조립 부팅 가드. 별도 태스크 = 별도 JVM 이어야 한다 — @ActiveProfiles 가 컨텍스트 캐시 키의
      # 일부라, prod 조립 테스트와 같은 JVM 에 두면 9-BC 컨텍스트가 두 벌 뜨고 @Scheduled 워커도 두 벌이
      # 같은 pgmq 큐를 동시 폴링한다. 위에서 띄운 postgres(55433)를 그대로 쓰므로 추가 인프라는 없다.
      # ★ 이 스텝을 지우면 태그로 분리된 가드가 CI 에서 0회 실행된다 —
      #   ci-module-coverage.test.ts 가 그 회귀를 차단한다.
      - name: Test — :modules:app (비-prod 조립 부팅 가드)
        working-directory: backend
        run: ./gradlew :modules:app:nonProdAssemblyTest --console=plain

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-app
          path: |
            backend/modules/app/build/test-results/test/*.xml
            backend/modules/app/build/test-results/nonProdAssemblyTest/*.xml
          if-no-files-found: warn
          retention-days: 7

      # ★self-hosted 러너는 머신이 살아남는다. 지우지 않으면 컨테이너와 55433 점유가 남아
      # **다음 실행이 포트 충돌로 죽는다** — GitHub 호스팅 러너에는 없던 책임이다.
      # 실패 시에도 돌아야 하므로 always. 로그는 위 헬스 대기 스텝이 이미 덤프한다.
      - name: postgres 정리
        if: always()
        run: docker rm -f "$CI_PG_CONTAINER" 2>/dev/null || true

  # ── 정적 분석 — 테스트와 독립 예산. --rerun-tasks 로 캐시 거짓 초록을 막는다 ──
  lint:
    name: ktlint + detekt
    needs: runner-health
    runs-on: [self-hosted, bts-local]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # ★--rerun-tasks 가 핵심이다. 빌드 캐시가 있으면 위반이 있어도 UP-TO-DATE 로 통과해
      # "린트 초록" 이 거짓이 된다(로컬에서 실제로 겪은 실패 양식).
      - name: ktlint + detekt (캐시 우회)
        working-directory: backend
        run: ./gradlew ktlintCheck detekt --console=plain --rerun-tasks

  # ── 워크플로우 스크립트 판별식은 여기 없다 ──────────────────────────────────
  # 2026-07-30 에 `.github/workflows/workflow-scripts-ci.yml` 로 이관했다.
  #
  # 왜 옮겼나. `paths` 는 워크플로우 레벨이라 잡별 필터가 없다. 판별식 입력(워크플로우 파일 ·
  # FR 문서 · 스킬 분기표)을 이 파일의 트리거에 얹으면, 그 입력 한 줄 고치는 PR 이 아래 12잡을
  # 전부 끌고 온다 — self-hosted 러너 1대에서 50~60분이다. 판별식 자체는 2분이다.
  #
  # ★되돌려서 여기로 다시 옮기지 마라. 옮기면 `ci-runner-label-alignment.test.ts` 와
  # `preview-cors-origin-alignment.test.ts` 가 검사하는 워크플로우 파일도 함께 바꿔야 한다 —
  # 안 바꾸면 두 판별식이 엉뚱한 파일의 트리거를 보며 조용히 통과한다.
