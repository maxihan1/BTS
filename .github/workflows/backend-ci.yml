# .github/workflows/backend-ci.yml — BTS 백엔드 CI (BC 모듈 병렬 + 조립 부팅 별도 잡)
#
# 왜 필요한가. 2026-07-27 실측 시점까지 **백엔드 테스트 10,036건이 CI 에서 한 번도 돌지 않았다.**
# 머지 검증이 전적으로 로컬 수동 실행에 의존했다 — 로컬을 건너뛴 PR 하나가 그대로 main 에 들어간다.
# (`infra-ci.yml` 이 `backend/**` 를 경로 트리거로 걸고 있어 "백엔드도 CI 가 있다" 로 오인하기 쉬우나,
#  그 워크플로우가 돌리는 것은 nginx·springdoc 봉인 스크립트뿐이고 Gradle 테스트는 0건이다.)
#
# ## 잡 구조 — 왜 모듈별로 쪼개나
# 전체 스위트는 로컬 M-series 에서 33분이다(2026-07-27 실측). 단일 잡으로 두면 PR 피드백이 그만큼 늦고,
# 한 모듈이 실패해도 나머지 결과를 못 본다. BC 모듈을 매트릭스로 병렬화하면 벽시계가 최장 모듈
# (issue-tracking, 3,185 테스트) 수준으로 수렴한다.
#
# ## 두 종류의 DB 의존을 구분한다
#  1. **Testcontainers** (428 파일) — 러너 기본 Docker 로 스스로 컨테이너를 띄운다. 서비스 컨테이너 불요.
#  2. **외부 5433 postgres** (10 파일, `:modules:app` 조립 부팅) — `ProdAssemblyHttpTestBase` 가
#     Testcontainers 를 관리하지 않고 `application.yml` 의 `jdbc:postgresql://localhost:5433/bts` 를 그대로 쓴다.
#     ⇒ **이 잡에만** 서비스 컨테이너를 붙인다.
#
# ## ★ postgres 이미지를 바꾸지 마라
# 반드시 `quay.io/tembo/pg16-pgmq` 여야 한다. 일반 `postgres:16` 에는 pgmq 확장이 없어
# 조립 부팅이 마이그레이션 단계에서 실패한다 (ADR `docs/adr/2026-05-22-pgmq-postgres-image.md`).
# 포트도 **5433:5432** 로 고정 — 애플리케이션 기본값이 5433 이라 5432 로 매핑하면 조용히 못 붙는다.
name: backend-ci

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      # ★scripts/workflow/** 는 실수가 아니다. `ci-module-coverage.test.ts` 가 이 파일의
      # 매트릭스와 settings.gradle.kts 의 차집합을 강제한다 — 한쪽만 걸면 판별식이 안 돈다.
      - 'scripts/workflow/**'
      # ★apps/web/vite.config.ts 도 같은 사유다. `preview-cors-origin-alignment.test.ts` 가
      # vite 의 로컬 포트와 application.yml 의 CORS 허용 오리진의 차집합을 강제한다.
      # 백엔드 쪽 축은 backend/** 가 이미 덮지만, 프론트 쪽 축을 걸지 않으면 포트만 바꾼 PR 에서
      # 판별식이 0회 실행된다(그 PR 이 정확히 이 결함을 만드는 PR 이다).
      - 'apps/web/vite.config.ts'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'scripts/workflow/**'
      # pull_request 와 같은 사유. 한쪽 블록에만 넣으면 봉인이 절반만 닫힌다.
      - 'apps/web/vite.config.ts'
      - 'package.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── BC 모듈 — Testcontainers 자체 기동, 서비스 컨테이너 불요 ──────────────────
  modules:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    # 관측치(2026-07-27 로컬). issue-tracking 7~10분 · identity-access 10~16분 · 나머지 5분 이하.
    # CI 러너는 로컬보다 느리므로 여유를 크게 잡는다. 매트릭스라 총 과금 시간은 늘지만 벽시계는 줄어든다.
    timeout-minutes: 45
    strategy:
      # 한 모듈이 깨져도 나머지 결과를 봐야 원인 범위를 좁힐 수 있다.
      fail-fast: false
      matrix:
        module:
          - shared-kernel
          - identity-access
          - project-workflow
          - issue-tracking
          - agile-planning
          - notification
          - search-export-import
          - slack-integration
          - automation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Test — :modules:${{ matrix.module }}
        working-directory: backend
        run: ./gradlew :modules:${{ matrix.module }}:test --console=plain

      # 실패 시 원인 파악에 XML 이 필요하다. 로그만으로는 어느 케이스가 깨졌는지 안 보인다.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.module }}
          path: backend/modules/${{ matrix.module }}/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 7

  # ── 조립 부팅 — 9 BC 를 한 컨텍스트에 올린다. 외부 5433 postgres 필요 ─────────
  assembly:
    name: app (조립 부팅)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # ★pgmq 확장 필수 — 일반 postgres:16 으로 바꾸면 마이그레이션에서 실패한다.
        image: quay.io/tembo/pg16-pgmq:latest
        env:
          POSTGRES_DB: bts
          POSTGRES_USER: bts
          POSTGRES_PASSWORD: bts
        ports:
          # ★5433 고정 — application.yml 기본값이 jdbc:postgresql://localhost:5433/bts 다.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bts -d bts"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # 조립 부팅은 prod 프로파일 + 실 Tomcat(RANDOM_PORT)으로 서블릿 필터체인까지 태운다.
      # MockMvc 가 우회하는 것(permitAll·CSRF-ignore·멀티파트 상한)을 여기서만 잡을 수 있다.
      - name: Test — :modules:app (prod 조립 컨텍스트)
        working-directory: backend
        run: ./gradlew :modules:app:test --console=plain

      # 비-prod 조립 부팅 가드. 별도 태스크 = 별도 JVM 이어야 한다 — @ActiveProfiles 가 컨텍스트 캐시 키의
      # 일부라, prod 조립 테스트와 같은 JVM 에 두면 9-BC 컨텍스트가 두 벌 뜨고 @Scheduled 워커도 두 벌이
      # 같은 pgmq 큐를 동시 폴링한다. 위 잡의 서비스 컨테이너(pgmq + 5433)를 그대로 쓰므로 추가 인프라는 없다.
      # ★ 이 스텝을 지우면 태그로 분리된 가드가 CI 에서 0회 실행된다 —
      #   ci-module-coverage.test.ts 가 그 회귀를 차단한다.
      - name: Test — :modules:app (비-prod 조립 부팅 가드)
        working-directory: backend
        run: ./gradlew :modules:app:nonProdAssemblyTest --console=plain

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-app
          path: |
            backend/modules/app/build/test-results/test/*.xml
            backend/modules/app/build/test-results/nonProdAssemblyTest/*.xml
          if-no-files-found: warn
          retention-days: 7

  # ── 정적 분석 — 테스트와 독립 예산. --rerun-tasks 로 캐시 거짓 초록을 막는다 ──
  lint:
    name: ktlint + detekt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # ★--rerun-tasks 가 핵심이다. 빌드 캐시가 있으면 위반이 있어도 UP-TO-DATE 로 통과해
      # "린트 초록" 이 거짓이 된다(로컬에서 실제로 겪은 실패 양식).
      - name: ktlint + detekt (캐시 우회)
        working-directory: backend
        run: ./gradlew ktlintCheck detekt --console=plain --rerun-tasks

  # ── 워크플로우 스크립트 판별식 ──────────────────────────────────────────────
  # 2026-07-27 발견 — `pnpm test:workflow`(57건)를 **어느 CI 도 돌리지 않고 있었다.**
  # 그 안에는 하드코딩 목록끼리의 정합을 강제하는 판별식 3종이 들어 있다
  # (BC 키워드 커버리지 · 스킬 분기표 ↔ TaskType · 이 파일의 매트릭스 ↔ Gradle 모듈).
  # 안 돌리면 봉인이 로컬 1회성 확인으로 끝나고 썩는다 — infra-ci.yml 이 존재하는 이유와 같다.
  workflow-scripts:
    name: 워크플로우 스크립트 판별식
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node 22 (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: 판별식 (BC 키워드 · 스킬 분기표 · CI 매트릭스 커버리지)
        run: pnpm test:workflow
