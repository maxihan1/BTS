# Gradle 실행 설정 — 성능 스위치와 그 상한. 계약은 scripts/workflow/gradle-perf-contract.test.ts
#
# 2026-08-25 실측으로 daemon/parallel/caching 을 켰다. 그 전에는 아무것도 안 바뀐
# no-op 빌드가 12초였다(3 tasks up-to-date) — 전부 JVM 콜드 스타트 + configuration 비용이다.
#
# ★parallel 은 일부러 false 다. 켜는 것이 이득처럼 보이지만 실측이 아니라고 말했다.
#   2026-08-25 전량 test --rerun-tasks A/B —
#     parallel=true   762초, :modules:notification:test 실패로 중단(52/59).
#                     재실행하면 실패 대상이 바뀐다(SUB-2 → SUB-1) = 흔들림이지 결함이 아니다.
#     parallel=false  928초, 59/59 전량 실행, BUILD SUCCESSFUL.
#   실질 이득은 ~18% 뿐이다. 프로파일상 parallel=true 는 경합으로 각 태스크를 2배 느리게
#   만들고(태스크 합계 28.5분) 병렬로 그걸 겨우 되돌린다.
#   깨지는 쪽은 NotificationWorkerSubscriptionFilterTest 처럼 Awaitility + poll-interval
#   50ms 로 시간에 민감한 워커 테스트다. CPU 를 뺏기면 진다.
#   ⇒ 되살리려면 **먼저 그 테스트들의 시간 민감성을 없애라.** 순서가 반대면 가짜 초록이다.
#   판별식이 이 값을 잡는다 — scripts/workflow/gradle-perf-contract.test.ts
#
# ★caching=true 의 부작용. ktlint/detekt 가 캐시로 UP-TO-DATE 통과할 수 있다. 로컬 검증은
#   반드시 `./gradlew ktlintCheck detekt --rerun-tasks` 로 부른다(CI 는 이미 그렇게 한다).
#   판별식이 그 짝을 강제한다.

# 메모리 — 이 머신은 16GB 이고 Testcontainers 가 Docker 쪽 메모리를 따로 먹는다.
# 여유를 남기지 않으면 병렬 테스트에서 컨테이너와 JVM 이 서로를 굶긴다.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m

org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
# configuration cache — 9개 모듈의 configuration 시점 `docker context inspect` 를
# providers.exec 로 옮긴 뒤에야 열렸다(2026-08-25). 되돌리면 이 줄도 같이 꺼야 한다.
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# 병렬 폭 상한 — 8코어지만 4로 묶는다. 모듈 test 태스크가 동시에 뜨면 각자
# 1024m JVM + Postgres 컨테이너를 들고 오므로 코어 수만큼 열면 16GB 를 넘긴다.
org.gradle.workers.max=4
