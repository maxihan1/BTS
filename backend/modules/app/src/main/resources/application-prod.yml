# 배포 조립 앱 prod 프로파일 — 운영 전용 override. 모든 시크릿은 환경변수 fail-fast(미설정 시 기동 즉시 실패).
# base application.yml 위에 병합된다. identity-access application-prod.yml 의 prod 정책을 조립 앱으로 중앙화.

server:
  # 운영 경로는 host Caddy(TLS 종단) → nginx(http) → backend. 이것이 없으면 nginx 가 넘긴 X-Forwarded-Proto 를
  # 무시해 {baseUrl} 이 http 가 된다 — OIDC redirect_uri · SAML ACS 가 http 로 나가 IdP 가 거절한다.
  # native = Tomcat RemoteIpValve — 사설 대역 · 루프백(nginx 컨테이너)에서 온 X-Forwarded-* 만 믿는다.
  # 영향. request.remoteAddr 가 nginx IP 대신 실 클라이언트 IP 가 된다(로그인 감사 로그 ip_address · 세션 IP).
  # IP 로 세는 속도 제한은 backend 에 없다(MFA 시도 제한은 userId 기준, /ws 상한은 nginx 가 센다).
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        # prod 는 https 강제이므로 JSESSIONID 에 Secure 플래그(base 의 SameSite=None 과 짝).
        secure: true

bts:
  auth:
    # 운영 issuer URI — 미설정 시 placeholder 해소 실패로 fail-fast (EC-30). 예: https://bts.example.com
    issuer-uri: ${BTS_AUTH_ISSUER_URI}
    jwt:
      # 운영 RSA 개인키 PEM 절대경로 — PemFileKeyProvider(@Profile("prod")) 가 로드, dev 인메모리 fallback 금지 (BLOCKER #6).
      private-key-pem-path: ${BTS_JWT_PRIVATE_KEY_PATH}
