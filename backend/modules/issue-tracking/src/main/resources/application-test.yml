# issue-tracking 모듈 test profile — Testcontainers Postgres 동적 주입
# IssueTestcontainersBase 의 @DynamicPropertySource 가 datasource url/username/password 를 런타임에 주입.
# spring.profiles.active=test 또는 @ActiveProfiles("test") 로 활성화.
#
# [dev vs test 차이]
#   dev  — 실제 로컬 postgres (5433) 연결.
#   test — Testcontainers 동적 datasource 주입.
#
# ★ dev 시드는 이 모듈에 없다 — 조립 앱의 NonProdDevSeedRunner 로 단일화(2026-07-29, data-dev.sql 삭제).

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  datasource:
    # url/username/password 는 Testcontainers @DynamicPropertySource 가 동적 주입 — 여기서 지정하지 않음.
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      # never: 통합 테스트는 Flyway 마이그레이션 + 각 테스트 자체 setup 사용 (격리 보장).
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration/issue-tracking
    # PR #10 learning — placeholder 치환 비활성화. dev yml 과 동일하게 적용.
    placeholder-replacement: false

# MinIO 오브젝트 스토리지 — Testcontainers 가 동적 endpoint 를 주입하므로 기본값은 placeholder.
# MinioStorageAdapterTest 는 MinioClient 를 직접 생성해 주입하므로 이 설정을 사용하지 않는다.
# Spring ApplicationContext 기반 통합 테스트에서는 @DynamicPropertySource 로 override 해야 한다.
bts:
  minio:
    endpoint: ${BTS_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${BTS_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${BTS_MINIO_SECRET_KEY:minioadmin}
    bucket: ${BTS_MINIO_BUCKET:bts-attachments-test}
  # ClamAV 안티바이러스 데몬 — 기본값(localhost:3310)은 전체 ApplicationContext 통합테스트에서
  # ClamavConfig 의 host fail-fast(check(hasText))를 통과시켜 부팅이 깨지지 않게 하는 용도다(lazy connect 라 미가동이어도 빈 생성 성공).
  # 실 clamd 통합테스트(ClamdInstreamScannerIntegrationTest)는 컨테이너의 동적 매핑 포트로 ClamdInstreamScanner 를 직접 생성하므로 이 설정을 쓰지 않는다.
  clamav:
    host: ${BTS_CLAMAV_HOST:localhost}
    port: ${BTS_CLAMAV_PORT:3310}
