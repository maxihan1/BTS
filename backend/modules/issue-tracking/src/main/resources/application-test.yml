# issue-tracking 모듈 test profile — Testcontainers Postgres 동적 주입 + dev seed 미적용
# IssueTestcontainersBase 의 @DynamicPropertySource 가 datasource url/username/password 를 런타임에 주입.
# spring.profiles.active=test 또는 @ActiveProfiles("test") 로 활성화.
#
# [dev vs test 차이]
#   dev  — data-dev.sql 로드 (sql.init.mode=always), 실제 로컬 postgres (5433) 연결.
#   test — data-dev.sql 미로드 (sql.init.mode=never),  Testcontainers 동적 datasource 주입.

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  datasource:
    # url/username/password 는 Testcontainers @DynamicPropertySource 가 동적 주입 — 여기서 지정하지 않음.
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      # never: 통합 테스트는 Flyway 마이그레이션 + 각 테스트 자체 setup 사용.
      # dev seed (data-dev.sql) 는 테스트 환경에 불필요 — 격리 보장.
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration/issue-tracking
    # PR #10 learning — placeholder 치환 비활성화. dev yml 과 동일하게 적용.
    placeholder-replacement: false

# MinIO 오브젝트 스토리지 — Testcontainers 가 동적 endpoint 를 주입하므로 기본값은 placeholder.
# MinioStorageAdapterTest 는 MinioClient 를 직접 생성해 주입하므로 이 설정을 사용하지 않는다.
# Spring ApplicationContext 기반 통합 테스트에서는 @DynamicPropertySource 로 override 해야 한다.
bts:
  minio:
    endpoint: ${BTS_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${BTS_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${BTS_MINIO_SECRET_KEY:minioadmin}
    bucket: ${BTS_MINIO_BUCKET:bts-attachments-test}
