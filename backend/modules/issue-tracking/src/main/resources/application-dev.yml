# issue-tracking 모듈 dev profile — datasource 5433 + Flyway issue-tracking namespace
# spring.profiles.active=dev 시에만 이 파일이 적용된다.
# 기동 방법: ./gradlew :modules:issue-tracking:bootRun --args='--spring.profiles.active=dev'
# 사전 조건: docker compose -f infra/docker-compose.dev.yml up -d postgres
#
# [dev vs test 차이]
#   dev  — 실제 로컬 postgres (5433) 연결.
#   test — Testcontainers 동적 datasource 주입.
#
# ★ dev 시드는 여기 없다 — 조립 앱(:modules:app)의 NonProdDevSeedRunner 한 벌로 단일화했다(2026-07-29).
#   과거에는 이 파일이 classpath:data-dev.sql 로 ATLAS 프로젝트 1건을 넣었으나, 두 모듈이 같은 리소스
#   이름을 써서 조립 클래스패스에서 충돌해 조립에서는 애초에 비활성이었다. 장치 2벌이 어긋나는 것을 막기 위해 삭제했다.
#   ⇒ 이 모듈을 **단독으로** dev 로 띄우면 ATLAS 프로젝트가 자동 생성되지 않는다.
#     조립 앱으로 띄운 뒤 /projects/new 화면에서 만들 것(실 생성 경로가 곧 손검증 대상이다).

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  datasource:
    # docker compose 의 postgres 가 host 5432 (Homebrew postgres 흔히 점유) 와 충돌 회피 위해 5433 매핑.
    # identity-access 와 동일 포트 — infra/docker-compose.dev.yml postgres 노출 포트 기준.
    url: ${BTS_DB_URL:jdbc:postgresql://localhost:5433/bts}
    username: ${BTS_DB_USERNAME:bts}
    password: ${BTS_DB_PASSWORD:bts}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration/issue-tracking
    baseline-on-migrate: true
    # PR #10 learning — Flyway 가 ${...} 패턴을 변수로 치환하려 해서 SQL 파싱 오류 발생.
    # placeholder-replacement: false 로 비활성화해 순수 SQL 그대로 실행.
    placeholder-replacement: false

# MinIO 오브젝트 스토리지 — docker-compose.dev.yml 의 minio 서비스 기준 (localhost:9000)
bts:
  minio:
    endpoint: ${BTS_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${BTS_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${BTS_MINIO_SECRET_KEY:minioadmin}
    bucket: ${BTS_MINIO_BUCKET:bts-attachments}
  # ClamAV 안티바이러스 데몬 — docker-compose.dev.yml 의 clamav 서비스 기준 (localhost:3310).
  # prod 은 BTS_CLAMAV_HOST / BTS_CLAMAV_PORT 환경변수로 주입.
  clamav:
    host: ${BTS_CLAMAV_HOST:localhost}
    port: ${BTS_CLAMAV_PORT:3310}
  issue:
    # 마감일 스캔 배치 cron (Spring cron: 초 분 시 일 월 요일).
    # 기본값: 매일 00:00 UTC = KST 09:00 — 한국 사용자 업무 시작 직전 스캔.
    # @Scheduled 어노테이션의 placeholder 기본값으로도 동작하므로 이 항목 미설정 시 기본값 적용.
    due-scan:
      cron: "0 0 0 * * *"
