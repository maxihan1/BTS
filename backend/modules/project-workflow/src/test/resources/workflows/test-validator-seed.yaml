# validators/post_actions 시드 검증용 테스트 워크플로우 YAML
key: test-validator-seed
name: Validator 시드 테스트 워크플로우
description: YamlSeedValidatorPostActionTest 전용 — 표준 4 워크플로우와 무관
states:
  - { key: open, name: Open, category: TODO, displayOrder: 1 }
  - { key: in_progress, name: In Progress, category: IN_PROGRESS, displayOrder: 2 }
  - { key: done, name: Done, category: DONE, displayOrder: 3 }
transitions:
  - from: open
    to: in_progress
    name: Start Work
    validators:
      - type: RequiredField
        config:
          field: resolution
      - type: Permission
        config:
          role: DEVELOPER
    post_actions:
      - type: SetField
        config:
          field: assignee
          value: actor
  - from: in_progress
    to: done
    name: Complete
    validators:
      - type: RequiredField
        config:
          field: resolution
    post_actions: []
  - from: done
    to: open
    name: Reopen
