# identity-access 모듈 Spring Boot 설정 — 개발 환경 (Keycloak 8180, 앱 8090)

server:
  port: 8090

spring:
  datasource:
    url: ${BTS_DB_URL:jdbc:postgresql://localhost:5432/bts}
    username: ${BTS_DB_USERNAME:bts}
    password: ${BTS_DB_PASSWORD:bts}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  ldap:
    urls: ${BTS_LDAP_URL:ldap://localhost:389}
    base: ${BTS_LDAP_BASE_DN:dc=bts,dc=local}
    username: ${BTS_LDAP_BIND_DN:cn=admin,dc=bts,dc=local}
    password: ${BTS_LDAP_BIND_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${BTS_KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/bts}
      client:
        registration:
          keycloak:
            client-id: bts-web
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/bts

logging:
  level:
    root: INFO
    com.atlas.bts: DEBUG
    org.springframework.security: INFO
