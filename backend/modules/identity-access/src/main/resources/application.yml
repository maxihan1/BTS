# identity-access 모듈 Spring Boot 설정 — 개발 환경 기본값 (앱 8090)
# prod 환경 override: application-prod.yml 참조

server:
  port: 8090
  servlet:
    session:
      cookie:
        # FR-AU-08b (EC17) — SAML ACS 는 IdP 가 외부에서 cross-site POST 로 콜백한다.
        # JSESSIONID 가 SameSite=Strict 면 그 POST 에 동반되지 않아 SSO 연결 시작(start) 단계
        # 세션이 끊긴다. None 으로 cross-site 동반을 허용하되, CSRF 는 별도 토큰식(SameSite=Strict
        # 쿠키, 무변경)으로 방어하므로 안전하다.
        # secure:true 는 application-prod.yml 에만 둔다 — base/dev/test 는 http 부팅이라
        # secure:true 면 JSESSIONID 가 방출되지 않아 SSO 왕복이 깨진다(C4).
        same-site: none

spring:
  datasource:
    url: ${BTS_DB_URL:jdbc:postgresql://localhost:5432/bts}
    username: ${BTS_DB_USERNAME:bts}
    password: ${BTS_DB_PASSWORD:bts}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # FR-PR-01 아바타 업로드 크기 정책.
      # 앱 정책(AvatarTypePolicy)은 5MB(=5MiB)를 상한으로 400 처리한다. 그런데 서블릿 기본
      # max-file-size 는 1MB 라, 그대로 두면 정상 1~5MB 아바타가 컨트롤러 검증에 도달하기 전에
      # MaxUploadSizeExceededException 으로 거부돼 500 이 된다(2MB 아바타 업로드가 prod 에서 깨짐).
      # 앱 정책보다 약간 위(6MB)로 올려, 5~6MB 는 앱이 400(AvatarValidationException),
      # 6MB 초과는 서블릿이 MaxUploadSizeExceededException → 컨트롤러 핸들러가 400 으로 매핑한다.
      max-file-size: 6MB
      max-request-size: 7MB
      # resolve-lazily=true: 멀티파트 파싱을 핸들러 인자 바인딩 시점으로 미뤄, 크기 초과 예외가
      # 컨트롤러 로컬 @ExceptionHandler 스코프(핸들러 메서드 컨텍스트) 안에서 잡히게 한다.
      # 모듈에 전역 @ControllerAdvice 가 없으므로, eager(기본) 파싱이면 예외가 핸들러 밖(DispatcherServlet
      # checkMultipart)에서 던져져 로컬 핸들러가 못 잡고 500 이 된다 — lazy 로 핸들러 컨텍스트로 끌어온다.
      resolve-lazily: true
  ldap:
    urls: ${BTS_LDAP_URL:ldap://localhost:389}
    base: ${BTS_LDAP_BASE_DN:dc=bts,dc=local}
    username: ${BTS_LDAP_BIND_DN:cn=admin,dc=bts,dc=local}
    password: ${BTS_LDAP_BIND_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          # FR-09-17: Keycloak issuer-uri 제거 — BTS 자체 JwksController (Task 23 Wave 6) 를 바라본다.
          #
          # JwtConfig.jwtDecoder() 가 NimbusJwtDecoder.withPublicKey() 로 공개키를 직접 주입하므로
          # Spring Boot 가 이 URI 로 원격 JWK Set 을 fetch 하지 않는다.
          # 이 설정은 향후 멀티 키 교체(key rotation) 또는 외부 검증 클라이언트가
          # Spring 표준 auto-configure 를 사용할 때를 대비한 fallback 선언이다.
          #
          # bts.auth.issuer-uri 기본값: http://localhost:8080 (로컬 개발 서버)
          jwk-set-uri: ${bts.auth.issuer-uri:http://localhost:8080}/.well-known/jwks.json
      # oauth2.client (registration/provider) 블록은 본 PR 에서 제거됨. plan §line 36
      # ("Keycloak 은 SDD 19.2 ProviderType.OIDC 의 한 인스턴스로 역할 재정의") 정신상
      # BTS prod 가 oauth2-client (외부 IdP 로그인) 를 직접 쓰지 않으므로 잔재 정리.
      # 미래 OidcAuthenticationProvider PR 에서 DB authn_providers.config 기반 동적 wiring 으로 재도입.

bts:
  auth:
    # BTS 자체 issuer URI — JWT iss 클레임 + JwksController endpoint 기반 URI
    # dev 기본값: http://localhost:8080 (로컬 개발 서버)
    # prod: application-prod.yml 의 BTS_AUTH_ISSUER_URI 환경변수로 override
    issuer-uri: ${BTS_AUTH_ISSUER_URI:http://localhost:8080}
  bootstrap:
    # 부트스트랩 시점에 SYSTEM_ADMIN 으로 승격할 사용자명 (FR-PM-08 Task 5).
    # 기본값은 빈 문자열 — 미설정 시 SystemAdminBootstrapRunner 가 아무 동작도 하지 않는다.
    # 이미 SYSTEM_ADMIN 보유자가 있으면 멱등 skip 하므로 재기동마다 재부여하지 않는다.
    # prod: BTS_BOOTSTRAP_ADMIN_USERNAME 환경변수로 주입 (Spring relaxed binding).
    admin-username: ${BTS_BOOTSTRAP_ADMIN_USERNAME:}
  webauthn:
    # WebAuthn(패스키/보안키) Relying Party 설정 (FR-MF-03).
    # rp-id: RP 식별 도메인(포트/스킴 미포함). origin: 허용 origin(스킴+호스트+포트).
    # dev 기본값은 로컬 SPA(5173) 기준. prod 는 BTS_WEBAUTHN_* 환경변수로 override (Spring relaxed binding).
    rp-id: ${BTS_WEBAUTHN_RP_ID:localhost}
    rp-name: ${BTS_WEBAUTHN_RP_NAME:BTS}
    origin: ${BTS_WEBAUTHN_ORIGIN:http://localhost:5173}

logging:
  level:
    root: INFO
    com.atlas.bts: DEBUG
    org.springframework.security: INFO
