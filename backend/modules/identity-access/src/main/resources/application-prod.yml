# identity-access prod 프로필 설정 — 환경변수 fail-fast (BLOCKER #6, EC-30)
# 이 파일은 --spring.profiles.active=prod 시 application.yml 위에 병합된다.

server:
  servlet:
    session:
      cookie:
        # FR-AU-08b (EC17/C4) — prod 는 https 강제이므로 JSESSIONID 에 Secure 플래그를 켠다.
        # base application.yml 의 SameSite=None 과 짝을 이룬다(SameSite=None 은 Secure 동반이 표준).
        # base/dev/test 에는 두지 않는다 — http 부팅 시 secure:true 면 쿠키 미방출로 SSO 왕복이 깨진다.
        secure: true

bts:
  auth:
    # prod 환경 BTS issuer URI — JWT iss 클레임 + /.well-known/jwks.json endpoint 기반
    # 환경변수 미설정 시 Spring placeholder 해소 실패 → 기동 즉시 실패 (EC-30 fail-fast)
    issuer-uri: ${BTS_AUTH_ISSUER_URI}

    jwt:
      # prod 환경 RSA 개인키 PEM 파일 절대 경로 — JwtKeyProviderConfig @Profile("prod") 가 주입.
      # dev/test 환경의 인메모리 키 생성(DevMemoryKeyProvider) 로 silent fallback 하지 않는다 (BLOCKER #6).
      # PemFileKeyProvider.load() 가 파일 존재 여부 + RSA CRT 형식 검증 후 fail-fast (EC-19).
      #
      # dev-key.pem 생성 책임: DevMemoryKeyProvider (Task 7) — prod 에서는 사용 금지.
      # prod key 생성 예시: openssl genrsa -out /secrets/bts-jwt.pem 2048
      private-key-pem-path: ${BTS_JWT_PRIVATE_KEY_PATH}
