# search-export-import 모듈 test profile — Import 매니페스트 + 첨부 zip 동시 업로드 multipart 상한 (FR-IM-01 PR4 Task 7)
# spring.profiles.active=test 또는 @ActiveProfiles("test") 로 활성화.
#
# dev profile(application-dev.yml)과 동일한 근거 — 매니페스트(최대 50MB) + 첨부 zip(최대 500MB) 합보다
# 여유 있는 상한을 둔다. Testcontainers 로 실제 Spring Boot 부팅 없이 조립하는 통합테스트
# (예: ImportControllerIntegrationTest)는 이 profile 을 거치지 않고 자체 MockMvc 컨텍스트를 쓰므로
# 이 설정과 무관하게 동작하지만, 향후 profile 기반 전체 부팅 테스트를 위해 dev 와 동일하게 맞춰둔다.
spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 600MB
