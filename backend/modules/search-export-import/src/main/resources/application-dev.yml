# search-export-import 모듈 dev profile — Import 매니페스트 + 첨부 zip 동시 업로드 multipart 상한 (FR-IM-01 PR4 Task 7)
# spring.profiles.active=dev 시에만 이 파일이 적용된다.
#
# POST /api/v1/imports 는 매니페스트(file, 최대 ImportJobService.MAX_FILE_SIZE_BYTES=50MB)와
# 첨부 zip(attachmentsZip, 최대 bts.import.attachments-zip.max-size 기본 500MB)을 같은 multipart
# 요청 안에 두 part 로 받는다.
# - max-file-size: 개별 part 상한 — 두 part 중 더 큰 zip(500MB) 기준.
# - max-request-size: 전체 요청 상한 — 매니페스트+zip 합(최대 550MB)보다 여유 있게 600MB.
spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 600MB
