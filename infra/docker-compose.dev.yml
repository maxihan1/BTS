# DEV ONLY — backend 의존 인프라 (postgres + keycloak). 자격 증명은 개발 전용이며 production 사용 금지.

services:
  postgres:
    # pgmq 확장 사전 설치된 Tembo 공식 이미지 (postgres:16 기반). ADR: docs/adr/2026-05-22-pgmq-postgres-image.md
    # 주의: :latest 태그는 dev 전용. prod 배포 전 구체적 버전 태그로 고정할 것.
    image: quay.io/tembo/pg16-pgmq:latest
    container_name: bts-postgres-dev
    environment:
      POSTGRES_DB: bts
      POSTGRES_USER: bts
      POSTGRES_PASSWORD: bts
    ports:
      # host 5432 는 Homebrew postgres 가 점유하는 경우가 흔해 5433 에 매핑.
      # backend 는 application-dev.yml 의 BTS_DB_URL 로 5433 사용.
      - "5433:5432"
    volumes:
      - bts-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bts -d bts"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-bts.json:/opt/keycloak/data/import/realm-bts.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/bts HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'bts'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  clamav:
    # ClamAV 안티바이러스 데몬 — 첨부 업로드 바이러스 스캔용 (FR-AC-01 D2).
    # CLAMAV_NO_FRESHCLAMD: freshclam(바이러스 DB 자동 업데이트) 비활성화 → 번들 DB로 dev 기동 빠름.
    # prod 은 freshclam 활성화 + 버전 태그 고정 필요.
    image: clamav/clamav:latest
    container_name: bts-clamav-dev
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
    ports:
      - "3310:3310"
    volumes:
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      # clamd PING/PONG 응답으로 데몬 준비 확인.
      # start_period 넉넉히 설정 — 번들 DB 로드에 30~60초 소요.
      test: ["CMD-SHELL", "echo PING | nc -w 5 localhost 3310 | grep -q PONG"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 60s

volumes:
  bts-postgres-data:
