# BTS 프론트 nginx — React SPA 정적 서빙 + 백엔드 경로 리버스 프록시 (조립 앱 bts-backend:8080)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 업로드 첨부 최대 크기 — 백엔드 멀티파트 정책(100MB)과 정렬
    client_max_body_size 110m;

    # Docker 임베디드 DNS. 백엔드가 아직 안 떴거나 재시작 중이어도 nginx 는 기동하고,
    # 요청 시점에 지연 해석(변수 proxy_pass)한다 → 프론트는 백엔드 다운과 무관하게 서빙.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── STOMP 웹소켓 — Upgrade 헤더 + 긴 타임아웃 ────────────────────────────────
    location /ws {
        set $bts_backend "bts-backend:8080";
        proxy_pass http://$bts_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── REST API + 인증/연동 콜백 경로 — 모두 조립 백엔드로 프록시 ──────────────
    # 주의. bare /login 은 프론트(React) 로그인 화면 경로이므로 프록시하지 않는다(그러면 백엔드가 401).
    # SSO 콜백 하위 경로(/login/oauth2/code/{id} · /login/saml2/sso/{id})만 백엔드로 보낸다.
    location ~ ^/(api|\.well-known|ical|slack|saml2|oauth2|login/(oauth2|saml2))(/|$) {
        set $bts_backend "bts-backend:8080";
        proxy_pass http://$bts_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── 프론트 SPA — 그 외 모든 경로는 index.html 로 폴백 (React Router) ──────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
