# BTS 프론트 nginx — React SPA 정적 서빙 + 백엔드 경로 리버스 프록시 (조립 앱 bts-backend:8080)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── 원본 스킴 보존 ───────────────────────────────────────────────────────────
# 앞단 TLS 종단(bts-caddy)이 https 를 받아 이 컨테이너로는 **http 로** 넘긴다. 그래서
# `X-Forwarded-Proto $scheme` 을 그대로 쓰면 Caddy 가 붙여 준 https 를 http 로 덮어써,
# 백엔드가 만드는 절대 URL(OIDC/SAML 콜백·리다이렉트)이 http 로 나간다.
# 앞단이 값을 줬으면 그것을 쓰고, 없으면($scheme) 직접 접근으로 보고 폴백한다.
map $http_x_forwarded_proto $bts_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# ── 실 클라이언트 IP 복원 (아래 /ws 상한의 전제) ───────────────────────────
# 이 컨테이너는 **호스트 포트를 열지 않는다** — 공개 진입점은 앞단 `bts-caddy` 이고
# `bts-web` 은 `bts-net` 안에서만 닿는다(`infra/docker-compose.prod.yml`). 그래서 여기에
# 도달한 요청은 전부 Caddy 를 거친 것이고, Caddy 가 붙인 `X-Forwarded-For` 의 마지막
# 홉이 실 클라이언트 IP 다.
#
# ★ 이 선언이 없으면 `$binary_remote_addr` 가 **Caddy 컨테이너 IP 하나**다. 아래 상한이
#   전 사용자를 한 사람으로 세어, 낮게 잡으면 사이트가 통째로 막히고 높게 잡으면 아무
#   공격도 못 막는다. 장부(부채 `/ws 동시 연결 상한`)의 처방이 「nginx 두 곳」이라 적혀
#   있었으나 그 처방은 Caddy 가 앞에 붙기 전 토폴로지를 전제한 것이다.
#
# 사설 대역을 신뢰하는 것이 안전한 이유. 호스트 포트가 없어 도커 네트워크 밖에서는
# 이 컨테이너에 아예 도달할 수 없다 — XFF 를 위조할 위치에 설 수 있는 것은 Caddy 뿐이다.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ── /ws 핸드셰이크 속도 상한 ────────────────────────────────────────────────
# 왜. `GET /ws` 는 익명 업그레이드가 성립한다(identity-access `SecurityConfig`). 붙은 소켓은
# 첫 메시지까지 30초를 버티므로(`WebSocketConfig.TIME_TO_FIRST_MESSAGE_MS`) 익명 요청 하나가
# 붙드는 자원이 종전(401 로 밀리초에 끊김) 대비 세 자릿수 배로 올랐다. `bts.maxihan.com` 은
# 공개 도메인이라 모집단이 사내로 묶이지 않는다.
#
# ★ **동시 연결(`limit_conn`)이 아니라 속도(`limit_req`)를 잡는다.** 사용자가 NAT·VPN 뒤에서
#   공인 IP 하나를 공유하면 동시 연결 상한은 그 조직 전체를 한 사람으로 묶어 정상 사용을
#   막는다 — 접속 토폴로지(`docs/sdd/04-architecture.md` §4.3)가 직접 접속과 VPN 을 함께
#   그리고 있어 공유 IP 를 배제할 수 없다. 속도 상한은 그 위험이 없으면서 단일 출처 홍수를
#   끊는다. 10 r/s 는 사람의 탭 열기·재접속보다 훨씬 높고, 30초 창에서 한 출처가 붙들 수
#   있는 슬롯을 수백 개로 **유한하게** 만든다.
# 동시 연결 상한은 접속 IP 분포를 실측한 뒤 별건으로 판단한다.
limit_req_zone $binary_remote_addr zone=bts_ws_handshake:10m rate=10r/s;

# ── 접속로그 경로토큰 마스킹 ─────────────────────────────────────────────────
# 왜. 공유 토큰·캘린더 피드 토큰·웹훅 토큰은 경로 세그먼트에 실린다. nginx 이미지 기본
# `log_format main` 의 $request 는 요청 첫 줄 통째(쿼리 포함)를 담아, 오류가 아니어도
# **정상 200 요청마다** 원문 토큰이 표준출력 → docker logs → 중앙 로그 수집기로 적재됐다.
# 불투명 토큰은 소지가 곧 인증이므로 로그에 남은 원문은 그대로 유효한 자격증명이다.
#
# 어떻게. 경로 목록을 하드코딩하지 않고 **길이로 판별**한다. 근거는 실측 분포.
#
#     정상 식별자 최대            토큰 최소
#     UUID 36자 ──────┐      ┌────── base64url 43자 (32바이트 무패딩)
#                     │  40  │       hex 64자 (32바이트)
#                     └──┬───┘
#                    임계값 (여백 4자 / 3자)
#
# 36 < 40 < 43 이라 길이만으로 완전 분리된다. 목록 방식이면 새 토큰 경로가 추가될 때
# 갱신을 잊는 순간 다시 새는데(이 작업 중 실제로 SPA 라우트를 놓쳤다), 길이 규칙은
# 설정을 건드리지 않아도 자동으로 가린다.
#
# ⚠️ 임계값 40 을 바꾸면 scripts/verify/nginx-log-masking.sh 봉인이 이 파일에서 값을
#    파싱해 토큰 길이와 대조한다. 아래 두 판별식은 **반드시 동일**해야 한다
#    (nginx map 은 정규식 공유를 지원하지 않아 중복이 불가피하다).
map $uri $bts_masked_uri {
    default                             $uri;
    "~^(.*/)[A-Za-z0-9_-]{40,}(.*)$"    "$1***$2";
}

# Referer 에도 같은 판별식. 공유 뷰(/dashboards/shared/{token})를 거쳐 API 를 호출하면
# 직전 페이지 URL 에 토큰이 담긴다 — 경로만 가리면 반쪽 봉합이 된다.
map $http_referer $bts_masked_referer {
    default                             $http_referer;
    ""                                  "-";
    "~^(.*/)[A-Za-z0-9_-]{40,}(.*)$"    "$1***$2";
}

# $request · $request_uri · $args 를 쓰지 않는다 — 셋 다 원문을 그대로 담는다.
# 메서드/경로/프로토콜을 따로 조립하면 쿼리 문자열 **값**은 목록 없이 자동으로 빠진다.
# 기본 main 포맷 대비 $request_time·$upstream_response_time 을 더해, 마스킹으로 잃는 것보다
# 장애 조사에 쓸 정보를 더 남긴다.
log_format bts_masked '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $bts_masked_uri $server_protocol" '
                      '$status $body_bytes_sent "$bts_masked_referer" "$http_user_agent" '
                      '"$http_x_forwarded_for" rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 이미지 기본 `access_log /var/log/nginx/access.log main` 상속을 끊는다.
    # 이 한 줄이 없으면 위 map 을 정의해도 아무 효과가 없다.
    access_log /var/log/nginx/access.log bts_masked;

    # 업로드 첨부 최대 크기 — 백엔드 멀티파트 정책(100MB)과 정렬
    client_max_body_size 110m;

    # Docker 임베디드 DNS. 백엔드가 아직 안 떴거나 재시작 중이어도 nginx 는 기동하고,
    # 요청 시점에 지연 해석(변수 proxy_pass)한다 → 프론트는 백엔드 다운과 무관하게 서빙.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── STOMP 웹소켓 — Upgrade 헤더 + 긴 타임아웃 ────────────────────────────────
    location /ws {
        # 익명 업그레이드가 성립하는 유일한 경로 — 위 zone 설명 참조.
        # burst 20 은 새로고침·재접속이 몰릴 때의 정상 여유고, nodelay 로 그 안에서는
        # 지연 없이 통과시킨다. 초과분은 503 이 아니라 429 로 낸다 — 클라이언트가
        # 「서버 고장」이 아니라 「속도 초과」로 구별할 수 있어야 한다.
        limit_req zone=bts_ws_handshake burst=20 nodelay;
        limit_req_status 429;

        set $bts_backend "bts-backend:8080";
        proxy_pass http://$bts_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $bts_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── REST API + 인증/연동 콜백 경로 — 모두 조립 백엔드로 프록시 ──────────────
    # 주의. bare /login 은 프론트(React) 로그인 화면 경로이므로 프록시하지 않는다(그러면 백엔드가 401).
    # SSO 콜백 하위 경로(/login/oauth2/code/{id} · /login/saml2/sso/{id})만 백엔드로 보낸다.
    location ~ ^/(api|\.well-known|ical|slack|saml2|oauth2|login/(oauth2|saml2))(/|$) {
        set $bts_backend "bts-backend:8080";
        proxy_pass http://$bts_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $bts_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # ── 프론트 SPA — 그 외 모든 경로는 index.html 로 폴백 (React Router) ──────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
