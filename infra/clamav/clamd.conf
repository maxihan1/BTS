# ClamAV 데몬 설정 — DEV 전용 최소 구성. prod 은 별도 보안 강화 설정 사용.
# StreamMaxLength/MaxFileSize/MaxScanSize: BTS 첨부 한도 100MB + 10MB 여유.
# TCPSocket/TCPAddr: INSTREAM 프로토콜 수신 (컨테이너 포트 3310).
# Foreground: 컨테이너 환경에서 데몬 forking 없이 직접 실행.

TCPSocket 3310
TCPAddr 0.0.0.0

# 스캔 크기 한도 — 3310 포트로 수신하는 스트림 최대 크기 (바이트 단위).
# StreamMaxLength 초과 시 "INSTREAM size limit exceeded" 응답 → fail-closed 처리.
StreamMaxLength 110M
MaxFileSize 110M
MaxScanSize 110M

Foreground yes
